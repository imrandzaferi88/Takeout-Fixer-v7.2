              private fun extractOrConvertAudio(inputUri: Uri, outputUri: Uri) {
                  progressConverter.progress = 10
                  tvConverterStatus.text = "Estrazione traccia audio in corso..."

                  lifecycleScope.launch(Dispatchers.IO) {
                      val tempOut = File(cacheDir, "temp_mux_${System.currentTimeMillis()}.m4a")
                      try {
                          val pfd = contentResolver.openFileDescriptor(inputUri, "r")
                              ?: throw IllegalStateException("Impossibile aprire il file sorgente")

                          val extractor = MediaExtractor()
                          extractor.setDataSource(pfd.fileDescriptor)

                          var audioTrackIndex = -1
                          for (i in 0 until extractor.trackCount) {
                              val format = extractor.getTrackFormat(i)
                              val mime = format.getString(MediaFormat.KEY_MIME) ?: ""
                              if (mime.startsWith("audio/")) {
                                  audioTrackIndex = i
                                  break
                              }
                          }

                          if (audioTrackIndex >= 0) {
                              extractor.selectTrack(audioTrackIndex)
                              val trackFormat = extractor.getTrackFormat(audioTrackIndex)
                              val muxer = MediaMuxer(
                                  tempOut.absolutePath,
                                  MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4
                              )
                              val dstTrack = muxer.addTrack(trackFormat)
                              muxer.start()

                              val buffer = ByteBuffer.allocate(256 * 1024)
                              val bufferInfo = MediaCodec.BufferInfo()

                              while (true) {
                                  val sampleSize = extractor.readSampleData(buffer, 0)
                                  if (sampleSize < 0) break
                                  bufferInfo.offset = 0
                                  bufferInfo.size = sampleSize
                                  bufferInfo.presentationTimeUs = extractor.sampleTime
                                  bufferInfo.flags = extractor.sampleFlags
                                  muxer.writeSampleData(dstTrack, buffer, bufferInfo)
                                  extractor.advance()
                              }

                              muxer.stop()
                              muxer.release()
                              extractor.release()
                              pfd.close()

                              contentResolver.openOutputStream(outputUri)?.use { outStream ->
                                  tempOut.inputStream().use { inStream ->
                                      inStream.copyTo(outStream)
                                  }
                              }
                          } else {
                              extractor.release()
                              pfd.close()
                              contentResolver.openInputStream(inputUri)?.use { inStream ->
                                  contentResolver.openOutputStream(outputUri)?.use { outStream ->
                                      inStream.copyTo(outStream)
                                  }
                              }
                          }

                          tempOut.delete()
                          withContext(Dispatchers.Main) {
                              progressConverter.progress = 100
                              tvConverterStatus.text = "[OK] Esportazione audio completata con successo."
                          }
                      } catch (e: Exception) {
                          tempOut.delete()
                          withContext(Dispatchers.Main) {
                              progressConverter.progress = 0
                              tvConverterStatus.text = "[ERRORE] ${e.localizedMessage}"
                          }
                      }
                  }
              }

              private fun setupEditorTab() {
