name: Build SoletteProst APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Genera struttura progetto Android
        run: |
          mkdir -p app/src/main/java/com/imran/solettepro

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SolettePro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.imran.solettepro"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.imran.solettepro"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />

              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />

              <application
                  android:allowBackup="true"
                  android:label="Solette Pro"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/imran/solettepro/MainActivity.kt
          package com.imran.solettepro

          import android.Manifest
          import android.annotation.SuppressLint
          import android.bluetooth.*
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import java.util.UUID

          class MainActivity : AppCompatActivity() {

              companion object {
                  const val MAC_LEFT = "FF:FF:11:B0:E1:57"
                  const val MAC_RIGHT = "FF:FF:11:B0:E5:5D"

                  // UUID corretti confermati dall'Inspector
                  val SERVICE_UUID: UUID = UUID.fromString("0000fff0-0000-1000-8000-00805f9b34fb")
                  val WRITE_CHAR_UUID: UUID = UUID.fromString("0000fff3-0000-1000-8000-00805f9b34fb")
                  val NOTIFY_CHAR_UUID: UUID = UUID.fromString("0000fff4-0000-1000-8000-00805f9b34fb")
              }

              private var bluetoothAdapter: BluetoothAdapter? = null
              private var gattLeft: BluetoothGatt? = null
              private var gattRight: BluetoothGatt? = null

              private lateinit var statusLeft: TextView
              private lateinit var statusRight: TextView
              private lateinit var logView: TextView
              private lateinit var hexInput: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val manager = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                  bluetoothAdapter = manager.adapter
                  setupUI()
                  checkPermissions()
              }

              private fun setupUI() {
                  val scroll = ScrollView(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(36, 36, 36, 36)
                  }

                  root.addView(makeHeader("SOLETTA SINISTRA (L)"))
                  statusLeft = TextView(this).apply { text = "Stato: Disconnessa" }
                  root.addView(statusLeft)

                  val rowConnL = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  rowConnL.addView(makeButton("Connetti L") { connectDevice(MAC_LEFT, true) })
                  rowConnL.addView(makeButton("Disconnetti L") { disconnectDevice(true) })
                  root.addView(rowConnL)

                  val rowCmdL = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  rowCmdL.addView(makeButton("ACCENDI (ON)") { sendPacket(true, "ON") })
                  rowCmdL.addView(makeButton("SPEGNI (OFF)") { sendPacket(true, "OFF") })
                  rowCmdL.addView(makeButton("ALTO") { sendPacket(true, "HIGH") })
                  root.addView(rowCmdL)

                  root.addView(makeHeader("SOLETTA DESTRA (R)").apply { setPadding(0, 32, 0, 8) })
                  statusRight = TextView(this).apply { text = "Stato: Disconnessa" }
                  root.addView(statusRight)

                  val rowConnR = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  rowConnR.addView(makeButton("Connetti R") { connectDevice(MAC_RIGHT, false) })
                  rowConnR.addView(makeButton("Disconnetti R") { disconnectDevice(false) })
                  root.addView(rowConnR)

                  val rowCmdR = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  rowCmdR.addView(makeButton("ACCENDI (ON)") { sendPacket(false, "ON") })
                  rowCmdR.addView(makeButton("SPEGNI (OFF)") { sendPacket(false, "OFF") })
                  rowCmdR.addView(makeButton("ALTO") { sendPacket(false, "HIGH") })
                  root.addView(rowCmdR)

                  // TEST HEX LIBERO
                  root.addView(makeHeader("INVIO HEX PERSONALIZZATO (su fff3):").apply { setPadding(0, 32, 0, 8) })
                  hexInput = EditText(this).apply { setText("AA0201030655") }
                  root.addView(hexInput)

                  val rowCustom = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  rowCustom.addView(makeButton("Invia a L") { sendCustomHex(true) })
                  rowCustom.addView(makeButton("Invia a R") { sendCustomHex(false) })
                  rowCustom.addView(makeButton("ENTRAMBE") { sendCustomHex(true); sendCustomHex(false) })
                  root.addView(rowCustom)

                  // LOG NOTIFICHE
                  val rowLogHeader = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 32, 0, 8)
                  }
                  rowLogHeader.addView(TextView(this).apply {
                      text = "LOG RISPOSTE (da fff4):"
                      textSize = 15f
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 2f)
                  })
                  rowLogHeader.addView(makeButton("Pulisci") { logView.text = "" })
                  root.addView(rowLogHeader)

                  logView = TextView(this).apply { text = "Pronto. Connetti e premi un tasto.\n"; textSize = 11f }
                  root.addView(logView)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun makeHeader(title: String) = TextView(this).apply {
                  text = title; textSize = 15f; setPadding(0, 10, 0, 6)
              }

              private fun makeButton(label: String, onClick: () -> Unit) = Button(this).apply {
                  text = label; textSize = 11f; gravity = Gravity.CENTER
                  layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                      setMargins(4, 4, 4, 4)
                  }
                  setOnClickListener { onClick() }
              }

              private fun checkPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      val perms = arrayOf(Manifest.permission.BLUETOOTH_CONNECT, Manifest.permission.BLUETOOTH_SCAN)
                      if (perms.any { ActivityCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }) {
                          ActivityCompat.requestPermissions(this, perms, 100)
                      }
                  }
              }

              @SuppressLint("MissingPermission")
              private fun connectDevice(mac: String, isLeft: Boolean) {
                  val adapter = bluetoothAdapter ?: return
                  disconnectDevice(isLeft)
                  val device = adapter.getRemoteDevice(mac)
                  updateStatus(isLeft, "Connessione...")

                  val callback = object : BluetoothGattCallback() {
                      override fun onConnectionStateChange(gatt: BluetoothGatt, status: Int, newState: Int) {
                          if (newState == BluetoothProfile.STATE_CONNECTED) {
                              updateStatus(isLeft, "Servizi...")
                              gatt.discoverServices()
                          } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                              updateStatus(isLeft, "Disconnessa")
                              gatt.close()
                              if (isLeft) gattLeft = null else gattRight = null
                          }
                      }

                      override fun onServicesDiscovered(gatt: BluetoothGatt, status: Int) {
                          if (status == BluetoothGatt.GATT_SUCCESS) {
                              updateStatus(isLeft, "Pronta (Connessa)")
                              enableNotifications(gatt)
                          }
                      }

                      override fun onCharacteristicChanged(gatt: BluetoothGatt, characteristic: BluetoothGattCharacteristic, value: ByteArray) {
                          val hex = value.joinToString(" ") { "%02X".format(it) }
                          val side = if (isLeft) "L" else "R"
                          log("RX [$side fff4]: $hex")
                      }

                      @Deprecated("Deprecated in Java")
                      override fun onCharacteristicChanged(gatt: BluetoothGatt, characteristic: BluetoothGattCharacteristic) {
                          if (Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU) {
                              @Suppress("DEPRECATION")
                              val hex = characteristic.value?.joinToString(" ") { "%02X".format(it) } ?: ""
                              val side = if (isLeft) "L" else "R"
                              log("RX [$side fff4]: $hex")
                          }
                      }
                  }
                  val gatt = device.connectGatt(this, false, callback, BluetoothDevice.TRANSPORT_LE)
                  if (isLeft) gattLeft = gatt else gattRight = gatt
              }

              @SuppressLint("MissingPermission")
              private fun enableNotifications(gatt: BluetoothGatt) {
                  val char = gatt.getService(SERVICE_UUID)?.getCharacteristic(NOTIFY_CHAR_UUID) ?: return
                  gatt.setCharacteristicNotification(char, true)
                  val desc = char.getDescriptor(UUID.fromString("00002902-0000-1000-8000-00805f9b34fb"))
                  desc?.let {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          gatt.writeDescriptor(it, BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE)
                      } else {
                          @Suppress("DEPRECATION")
                          it.value = BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE
                          @Suppress("DEPRECATION")
                          gatt.writeDescriptor(it)
                      }
                  }
              }

              @SuppressLint("MissingPermission")
              private fun disconnectDevice(isLeft: Boolean) {
                  val gatt = if (isLeft) gattLeft else gattRight
                  gatt?.disconnect()
                  gatt?.close()
                  if (isLeft) gattLeft = null else gattRight = null
                  updateStatus(isLeft, "Disconnessa")
              }

              private fun sendPacket(isLeft: Boolean, type: String) {
                  // Pacchetti strutturati tipici per riscaldatori BLE UART
                  val hex = when (type) {
                      "ON" -> "AA0201010455"
                      "OFF" -> "AA0201000355"
                      else -> "AA0201030655" // HIGH / ALTO
                  }
                  writeHexToGatt(if (isLeft) gattLeft else gattRight, isLeft, hex)
              }

              private fun sendCustomHex(isLeft: Boolean) {
                  val cleanHex = hexInput.text.toString().replace(" ", "").trim()
                  writeHexToGatt(if (isLeft) gattLeft else gattRight, isLeft, cleanHex)
              }

              @SuppressLint("MissingPermission")
              private fun writeHexToGatt(gatt: BluetoothGatt?, isLeft: Boolean, hexString: String) {
                  val side = if (isLeft) "L" else "R"
                  if (gatt == null) { log("Errore: $side non connessa"); return }
                  val bytes = hexToBytes(hexString) ?: { log("Hex errato"); return }

                  val targetChar = gatt.getService(SERVICE_UUID)?.getCharacteristic(WRITE_CHAR_UUID)
                  if (targetChar == null) { log("Caratteristica fff3 non trovata"); return }

                  val writeType = BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      gatt.writeCharacteristic(targetChar, bytes, writeType)
                  } else {
                      @Suppress("DEPRECATION")
                      targetChar.writeType = writeType
                      @Suppress("DEPRECATION")
                      targetChar.value = bytes
                      @Suppress("DEPRECATION")
                      gatt.writeCharacteristic(targetChar)
                  }
                  log("TX [$side fff3]: $hexString")
              }

              private fun hexToBytes(hex: String): ByteArray? {
                  if (hex.isEmpty() || hex.length % 2 != 0) return null
                  return try {
                      ByteArray(hex.length / 2) { i -> hex.substring(i * 2, i * 2 + 2).toInt(16).toByte() }
                  } catch (e: Exception) { null }
              }

              private fun updateStatus(isLeft: Boolean, text: String) {
                  runOnUiThread {
                      if (isLeft) statusLeft.text = "Soletta L: $text" else statusRight.text = "Soletta R: $text"
                  }
              }

              private fun log(msg: String) {
                  runOnUiThread { logView.append("$msg\n") }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  disconnectDevice(true)
                  disconnectDevice(false)
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolettePro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
