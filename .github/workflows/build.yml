name: Build SoletteBruteForce APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Genera struttura progetto Android
        run: |
          mkdir -p app/src/main/java/com/imran/solettebf

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SoletteBF"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.imran.solettebf"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.imran.solettebf"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />

              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />

              <application
                  android:allowBackup="true"
                  android:label="Solette BruteForce"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/imran/solettebf/MainActivity.kt
          package com.imran.solettebf

          import android.Manifest
          import android.annotation.SuppressLint
          import android.bluetooth.*
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import java.util.UUID

          class MainActivity : AppCompatActivity() {

              companion object {
                  const val MAC_LEFT = "FF:FF:11:B0:E1:57"
                  const val MAC_RIGHT = "FF:FF:11:B0:E5:5D"

                  val SERVICE_UUID: UUID = UUID.fromString("0000fff0-0000-1000-8000-00805f9b34fb")
                  val WRITE_CHAR_UUID: UUID = UUID.fromString("0000fff3-0000-1000-8000-00805f9b34fb")
              }

              private var bluetoothAdapter: BluetoothAdapter? = null
              private var gattLeft: BluetoothGatt? = null
              private var gattRight: BluetoothGatt? = null

              private lateinit var statusLeft: TextView
              private lateinit var statusRight: TextView
              private lateinit var currentHexView: TextView
              private lateinit var logView: TextView

              private var isTesting = false
              private val handler = Handler(Looper.getMainLooper())
              private var testRunnable: Runnable? = null
              private var currentPayloadIndex = 0
              private var lastSentHex = ""

              // Lista completa di payload candidati per Xinkesi / Freqchip
              private val payloadList = mutableListOf<String>().apply {
                  // Pattern AA ... 55
                  for (cmd in listOf("01", "02", "03")) {
                      for (valByte in listOf("01", "02", "03", "04", "05", "40", "50", "60")) {
                          add("AA01$cmd$valByte")
                          add("AA02$cmd$valByte")
                          add("AA01$cmd$valByte" + "55")
                          add("AA02$cmd$valByte" + "55")
                          add("AA0201$valByte" + "0455")
                          add("AA0202$valByte" + "3255")
                      }
                  }
                  // Pattern 55 AA ...
                  for (cmd in listOf("01", "02", "03")) {
                      for (valByte in listOf("01", "02", "03")) {
                          add("55AA$cmd$valByte")
                          add("55AA03$cmd$valByte")
                      }
                  }
                  // Pattern brevi A1 / Fe / FF
                  for (valByte in listOf("01", "02", "03", "10", "20", "30")) {
                      add("A101$valByte")
                      add("A102$valByte")
                      add("FE01$valByte")
                      add("01$valByte")
                      add("03$valByte")
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val manager = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                  bluetoothAdapter = manager.adapter
                  setupUI()
                  checkPermissions()
              }

              private fun setupUI() {
                  val scroll = ScrollView(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(36, 36, 36, 36)
                  }

                  root.addView(makeHeader("STATO CONNESSIONI:"))
                  statusLeft = TextView(this).apply { text = "Soletta L: Disconnessa" }
                  statusRight = TextView(this).apply { text = "Soletta R: Disconnessa" }
                  root.addView(statusLeft)
                  root.addView(statusRight)

                  val rowConn = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  rowConn.addView(makeButton("Connetti Entrambe") {
                      connectDevice(MAC_LEFT, true)
                      connectDevice(MAC_RIGHT, false)
                  })
                  rowConn.addView(makeButton("Disconnetti") {
                      disconnectDevice(true)
                      disconnectDevice(false)
                  })
                  root.addView(rowConn)

                  // --- SEZIONE TEST AUTOMATICO ---
                  root.addView(makeHeader("TEST AUTOMATICO VALORI (BRUTE-FORCE)").apply { setPadding(0, 32, 0, 8) })
                  
                  currentHexView = TextView(this).apply {
                      text = "Ultimo inviato: Nessuno"
                      textSize = 15f
                      setPadding(0, 8, 0, 8)
                  }
                  root.addView(currentHexView)

                  val rowTest = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  rowTest.addView(makeButton("AVVIA TEST L") { startBruteForce(true) })
                  rowTest.addView(makeButton("AVVIA TEST R") { startBruteForce(false) })
                  rowTest.addView(makeButton("AVVIA ENTRABBE") { startBruteForce(null) })
                  root.addView(rowTest)

                  val btnOk = Button(this).apply {
                      text = "¡ FUNZIONA! (FERMA TEST)"
                      textSize = 16f
                      setBackgroundColor(0xFFD32F2F.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener { stopBruteForce() }
                  }
                  root.addView(btnOk)

                  // --- LOG ---
                  root.addView(makeHeader("LOG:").apply { setPadding(0, 32, 0, 8) })
                  logView = TextView(this).apply { text = "Pronto.\n"; textSize = 12f }
                  root.addView(logView)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun makeHeader(title: String) = TextView(this).apply {
                  text = title; textSize = 16f; setPadding(0, 12, 0, 8)
              }

              private fun makeButton(label: String, onClick: () -> Unit) = Button(this).apply {
                  text = label; textSize = 12f; gravity = Gravity.CENTER
                  layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                      setMargins(6, 6, 6, 6)
                  }
                  setOnClickListener { onClick() }
              }

              private fun checkPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      val perms = arrayOf(Manifest.permission.BLUETOOTH_CONNECT, Manifest.permission.BLUETOOTH_SCAN)
                      if (perms.any { ActivityCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }) {
                          ActivityCompat.requestPermissions(this, perms, 100)
                      }
                  }
              }

              @SuppressLint("MissingPermission")
              private fun connectDevice(mac: String, isLeft: Boolean) {
                  val adapter = bluetoothAdapter ?: return
                  disconnectDevice(isLeft)
                  val device = adapter.getRemoteDevice(mac)
                  updateStatus(isLeft, "Connessione...")

                  val callback = object : BluetoothGattCallback() {
                      override fun onConnectionStateChange(gatt: BluetoothGatt, status: Int, newState: Int) {
                          if (newState == BluetoothProfile.STATE_CONNECTED) {
                              updateStatus(isLeft, "Servizi...")
                              gatt.discoverServices()
                          } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                              updateStatus(isLeft, "Disconnessa")
                              gatt.close()
                              if (isLeft) gattLeft = null else gattRight = null
                          }
                      }

                      override fun onServicesDiscovered(gatt: BluetoothGatt, status: Int) {
                          if (status == BluetoothGatt.GATT_SUCCESS) {
                              updateStatus(isLeft, "Pronta (Connessa)")
                          }
                      }
                  }
                  val gatt = device.connectGatt(this, false, callback, BluetoothDevice.TRANSPORT_LE)
                  if (isLeft) gattLeft = gatt else gattRight = gatt
              }

              @SuppressLint("MissingPermission")
              private fun disconnectDevice(isLeft: Boolean) {
                  val gatt = if (isLeft) gattLeft else gattRight
                  gatt?.disconnect()
                  gatt?.close()
                  if (isLeft) gattLeft = null else gattRight = null
                  updateStatus(isLeft, "Disconnessa")
              }

              private fun startBruteForce(isLeftTarget: Boolean?) {
                  if (isTesting) return
                  isTesting = true
                  currentPayloadIndex = 0
                  log("--- AVVIATO TEST AUTOMATICO (${payloadList.size} combinazioni) ---")

                  testRunnable = object : Runnable {
                      override fun run() {
                          if (!isTesting) return
                          if (currentPayloadIndex >= payloadList.size) {
                              log("Test completato. Nessuna risposta confermata.")
                              isTesting = false
                              return
                          }

                          val hex = payloadList[currentPayloadIndex]
                          lastSentHex = hex
                          currentHexView.text = "Test in corso [$currentPayloadIndex/${payloadList.size}]: $hex"

                          if (isLeftTarget == true || isLeftTarget == null) {
                              writeHexToGatt(gattLeft, "L", hex)
                          }
                          if (isLeftTarget == false || isLeftTarget == null) {
                              writeHexToGatt(gattRight, "R", hex)
                          }

                          currentPayloadIndex++
                          handler.postDelayed(this, 1200) // 1.2 secondi tra un comando e l'altro
                      }
                  }
                  handler.post(testRunnable!!)
              }

              private fun stopBruteForce() {
                  isTesting = false
                  testRunnable?.let { handler.removeCallbacks(it) }
                  currentHexView.text = "TEST FERMATO! Valore esatto bloccato: $lastSentHex"
                  log(">>> FERMATO! Il valore attivo al momento dello stop era: $lastSentHex")
                  Toast.makeText(this, "Valore salvato: $lastSentHex", Toast.LENGTH_LONG).show()
              }

              @SuppressLint("MissingPermission")
              private fun writeHexToGatt(gatt: BluetoothGatt?, side: String, hexString: String) {
                  if (gatt == null) return
                  val bytes = hexToBytes(hexString) ?: return
                  val targetChar = gatt.getService(SERVICE_UUID)?.getCharacteristic(WRITE_CHAR_UUID) ?: return

                  val writeType = BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      gatt.writeCharacteristic(targetChar, bytes, writeType)
                  } else {
                      @Suppress("DEPRECATION")
                      targetChar.writeType = writeType
                      @Suppress("DEPRECATION")
                      targetChar.value = bytes
                      @Suppress("DEPRECATION")
                      gatt.writeCharacteristic(targetChar)
                  }
              }

              private fun hexToBytes(hex: String): ByteArray? {
                  if (hex.isEmpty() || hex.length % 2 != 0) return null
                  return try {
                      ByteArray(hex.length / 2) { i -> hex.substring(i * 2, i * 2 + 2).toInt(16).toByte() }
                  } catch (e: Exception) { null }
              }

              private fun updateStatus(isLeft: Boolean, text: String) {
                  runOnUiThread {
                      if (isLeft) statusLeft.text = "Soletta L: $text" else statusRight.text = "Soletta R: $text"
                  }
              }

              private fun log(msg: String) {
                  runOnUiThread { logView.append("$msg\n") }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  stopBruteForce()
                  disconnectDevice(true)
                  disconnectDevice(false)
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoletteLR-debug
          path: app/build/outputs/apk/debug/app-debug.apk
