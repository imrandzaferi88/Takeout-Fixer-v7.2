name: Build TakeoutFixer v7 Pro

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Crea struttura sorgenti
        run: |
          mkdir -p app/src/main/java/com/takeout/fixer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TakeoutFixer"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.takeout.fixer'
              compileSdk 34

              defaultConfig {
                  applicationId "com.takeout.fixer"
                  minSdk 26
                  targetSdk 34
                  versionCode 7
                  versionName "7.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.exifinterface:exifinterface:1.3.7'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="md_primary">#0B57D0</color>
              <color name="md_on_primary">#FFFFFF</color>
              <color name="md_primary_container">#D3E3FD</color>
              <color name="md_on_primary_container">#041E49</color>
              <color name="app_background">#F8F9FA</color>
              <color name="card_background">#FFFFFF</color>
              <color name="card_stroke">#E0E3E7</color>
              <color name="inner_box_background">#F0F4F9</color>
              <color name="text_primary">#1F1F1F</color>
              <color name="text_secondary">#444746</color>
              <color name="text_tertiary">#747775</color>
              <color name="console_background">#1E1F20</color>
              <color name="console_text">#7CBBF3</color>
              <color name="accent_green">#146C2E</color>
              <color name="accent_amber">#B06000</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values-night/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="md_primary">#A8C7FA</color>
              <color name="md_on_primary">#062E6F</color>
              <color name="md_primary_container">#0842A0</color>
              <color name="md_on_primary_container">#D3E3FD</color>
              <color name="app_background">#111318</color>
              <color name="card_background">#1B1F27</color>
              <color name="card_stroke">#282E39</color>
              <color name="inner_box_background">#242933</color>
              <color name="text_primary">#E2E2E6</color>
              <color name="text_secondary">#C4C7C5</color>
              <color name="text_tertiary">#8E918F</color>
              <color name="console_background">#0D0E11</color>
              <color name="console_text">#A8C7FA</color>
              <color name="accent_green">#6DD58C</color>
              <color name="accent_amber">#FFB951</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.TakeoutFixer" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/md_primary</item>
                  <item name="colorOnPrimary">@color/md_on_primary</item>
                  <item name="colorPrimaryContainer">@color/md_primary_container</item>
                  <item name="colorOnPrimaryContainer">@color/md_on_primary_container</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Takeout Fixer</string>
              <string name="app_version">v7.0 Pro</string>
              <string name="app_subtitle">Organizzazione Metadati e Anno Mese</string>
              <string name="initial_setup_title">Configurazione Iniziale</string>
              <string name="perm_status_incomplete">Da completare</string>
              <string name="perm_status_complete">Pronto al 100%</string>
              <string name="setup_desc">Completa questi due passaggi per elaborare file grandi anche a schermo spento:</string>
              <string name="step_notif_title">Notifiche in background</string>
              <string name="step_notif_desc">Avanzamento live nella tendina</string>
              <string name="btn_activate">Attiva</string>
              <string name="btn_active">Attivo</string>
              <string name="step_battery_title">Ottimizzazione batteria</string>
              <string name="step_battery_desc">Consenti esecuzione senza restrizioni</string>
              <string name="btn_set">Imposta</string>
              <string name="btn_set_done">Impostato</string>
              <string name="input_card_title">1. Archivio Takeout</string>
              <string name="no_file_selected">Nessun file selezionato</string>
              <string name="btn_browse_zip">Scegli ZIP Takeout</string>
              <string name="output_card_title">2. Elaborazione e Salvataggio</string>
              <string name="output_desc">Genera un archivio suddiviso in Anno Mese con metadati EXIF e GPS inseriti senza file JSON.</string>
              <string name="btn_start">Salva e Avvia Elaborazione</string>
              <string name="ready">In attesa del file...</string>
              <string name="system_log">Console di Sistema</string>
              <string name="init_complete">Takeout Fixer v7.0 avviato con successo.</string>
              <string name="settings">Impostazioni</string>
              <string name="change_language">Lingua</string>
              <string name="change_theme">Tema dell app</string>
              <string name="default_folder">Cartella predefinita</string>
              <string name="about_creator">Autore dell app</string>
              <string name="theme_system">Segui sistema</string>
              <string name="theme_light">Tema Giorno Chiaro</string>
              <string name="theme_dark">Tema Notte Scuro</string>
              <string name="close">Chiudi</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/menu/main_menu.xml
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item
                  android:id="@+id/menu_folder"
                  android:title="Cartella di destinazione" />
              <item
                  android:id="@+id/menu_theme"
                  android:title="Tema (Giorno / Notte)" />
              <item
                  android:id="@+id/menu_language"
                  android:title="Lingua (Italiano / English)" />
              <item
                  android:id="@+id/menu_creator"
                  android:title="Autore dell app" />
          </menu>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0B57D0"
                  android:pathData="M24,24h60c6.6,0 12,5.4 12,12v36c0,6.6 -5.4,12 -12,12H24c-6.6,0 -12,-5.4 -12,-12V36c0,-6.6 5.4,-12 12,-12z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M34,36h40c3.3,0 6,2.7 6,6v24c0,3.3 -2.7,6 -6,6H34c-3.3,0 -6,-2.7 -6,-6V42c0,-3.3 2.7,-6 6,-6z"/>
              <path
                  android:fillColor="#FBBC04"
                  android:pathData="M44,48m-5,0a5,5 0,1 1,10 0a5,5 0,1 1,-10 0"/>
              <path
                  android:fillColor="#34A853"
                  android:pathData="M36,66l11,-15 9,12 8,-9 14,12z"/>
              <path
                  android:fillColor="#4285F4"
                  android:pathData="M64,30l6,6h-5c0,7.7 -6.3,14 -14,14 -2.5,0 -4.8,-0.7 -6.8,-1.8l2.4,-2.4c1.3,0.5 2.8,0.8 4.4,0.8 5.9,0 10.7,-4.8 10.7,-10.6h-4.7l7,-6z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/md_primary"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_more_vert.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#888888"
                  android:pathData="M12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,10c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2zM12,16c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_folder_zip.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#0B57D0"
                  android:pathData="M20,6h-8l-2,-2H4C2.9,4 2,4.9 2,6v12c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V8C22,6.9 21.1,6 20,6zM18,12h-2v2h2v2h-2v2h-2v-2h2v-2h-2v-2h2v-2h-2V8h2V12z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_check_circle.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#146C2E"
                  android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM10,17l-5,-5 1.41,-1.41L10,14.17l7.59,-7.59L19,8l-9,9z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_security.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#0B57D0"
                  android:pathData="M12,1L3,5v6c0,5.55 3.84,10.74 9,12 5.16,-1.26 9,-6.45 9,-12V5l-9,-4zm0,10.99h7c-.53,4.12 -3.28,7.79 -7,8.94V12H5V6.3l7,-3.11v8.8z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.TakeoutFixer">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FixerService"
                      android:foregroundServiceType="dataSync"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.coordinatorlayout.widget.CoordinatorLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/app_background">

              <androidx.core.widget.NestedScrollView
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:fillViewport="true">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="20dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical"
                          android:layout_marginBottom="18dp">

                          <ImageView
                              android:layout_width="44dp"
                              android:layout_height="44dp"
                              android:src="@drawable/ic_folder_zip"
                              android:layout_marginEnd="14dp"/>

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:orientation="vertical">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="@string/app_name"
                                  android:textSize="24sp"
                                  android:textStyle="bold"
                                  android:textColor="@color/text_primary"/>

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="@string/app_subtitle"
                                  android:textSize="12sp"
                                  android:textColor="@color/text_secondary"/>
                          </LinearLayout>

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="@string/app_version"
                              android:textStyle="bold"
                              android:textSize="11sp"
                              android:textColor="@color/md_on_primary_container"
                              android:background="@color/md_primary_container"
                              android:paddingHorizontal="8dp"
                              android:paddingVertical="4dp"
                              android:layout_marginEnd="6dp"
                              android:clipToOutline="true"/>

                          <com.google.android.material.button.MaterialButton
                              android:id="@+id/btnMenu"
                              style="@style/Widget.Material3.Button.IconButton"
                              android:layout_width="44dp"
                              android:layout_height="44dp"
                              app:icon="@drawable/ic_more_vert"
                              app:iconTint="@color/text_primary"/>
                      </LinearLayout>

                      <com.google.android.material.card.MaterialCardView
                          android:id="@+id/cardPermissions"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          app:cardCornerRadius="22dp"
                          app:cardElevation="0dp"
                          app:strokeWidth="1.5dp"
                          app:strokeColor="@color/md_primary"
                          app:cardBackgroundColor="@color/card_background"
                          android:layout_marginBottom="16dp">

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:padding="18dp">

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="horizontal"
                                  android:gravity="center_vertical"
                                  android:layout_marginBottom="10dp">

                                  <ImageView
                                      android:layout_width="22dp"
                                      android:layout_height="22dp"
                                      android:src="@drawable/ic_security"
                                      android:layout_marginEnd="8dp"/>

                                  <TextView
                                      android:layout_width="0dp"
                                      android:layout_height="wrap_content"
                                      android:layout_weight="1"
                                      android:text="@string/initial_setup_title"
                                      android:textStyle="bold"
                                      android:textSize="15sp"
                                      android:textColor="@color/text_primary"/>

                                  <TextView
                                      android:id="@+id/tvPermStatus"
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:text="@string/perm_status_incomplete"
                                      android:textStyle="bold"
                                      android:textSize="11sp"
                                      android:textColor="@color/accent_amber"/>
                              </LinearLayout>

                              <TextView
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="@string/setup_desc"
                                  android:textSize="12sp"
                                  android:textColor="@color/text_secondary"
                                  android:layout_marginBottom="14dp"/>

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="horizontal"
                                  android:gravity="center_vertical"
                                  android:background="@color/inner_box_background"
                                  android:padding="12dp"
                                  android:layout_marginBottom="8dp"
                                  android:clipToOutline="true">

                                  <TextView
                                      android:id="@+id/iconStepNotif"
                                      android:layout_width="24dp"
                                      android:layout_height="24dp"
                                      android:gravity="center"
                                      android:text="1"
                                      android:textStyle="bold"
                                      android:textColor="@color/md_primary"
                                      android:layout_marginEnd="10dp"/>

                                  <LinearLayout
                                      android:layout_width="0dp"
                                      android:layout_height="wrap_content"
                                      android:layout_weight="1"
                                      android:orientation="vertical">

                                      <TextView
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="@string/step_notif_title"
                                          android:textStyle="bold"
                                          android:textSize="13sp"
                                          android:textColor="@color/text_primary"/>

                                      <TextView
                                          android:id="@+id/tvNotifSub"
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="@string/step_notif_desc"
                                          android:textSize="11sp"
                                          android:textColor="@color/text_tertiary"/>
                                  </LinearLayout>

                                  <com.google.android.material.button.MaterialButton
                                      android:id="@+id/btnGrantNotif"
                                      android:layout_width="wrap_content"
                                      android:layout_height="38dp"
                                      android:text="@string/btn_activate"
                                      android:textSize="12sp"
                                      app:cornerRadius="12dp"
                                      style="@style/Widget.Material3.Button.TonalButton"/>
                              </LinearLayout>

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:orientation="horizontal"
                                  android:gravity="center_vertical"
                                  android:background="@color/inner_box_background"
                                  android:padding="12dp"
                                  android:clipToOutline="true">

                                  <TextView
                                      android:id="@+id/iconStepBattery"
                                      android:layout_width="24dp"
                                      android:layout_height="24dp"
                                      android:gravity="center"
                                      android:text="2"
                                      android:textStyle="bold"
                                      android:textColor="@color/md_primary"
                                      android:layout_marginEnd="10dp"/>

                                  <LinearLayout
                                      android:layout_width="0dp"
                                      android:layout_height="wrap_content"
                                      android:layout_weight="1"
                                      android:orientation="vertical">

                                      <TextView
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="@string/step_battery_title"
                                          android:textStyle="bold"
                                          android:textSize="13sp"
                                          android:textColor="@color/text_primary"/>

                                      <TextView
                                          android:id="@+id/tvBatterySub"
                                          android:layout_width="wrap_content"
                                          android:layout_height="wrap_content"
                                          android:text="@string/step_battery_desc"
                                          android:textSize="11sp"
                                          android:textColor="@color/text_tertiary"/>
                                  </LinearLayout>

                                  <com.google.android.material.button.MaterialButton
                                      android:id="@+id/btnGrantBattery"
                                      android:layout_width="wrap_content"
                                      android:layout_height="38dp"
                                      android:text="@string/btn_set"
                                      android:textSize="12sp"
                                      app:cornerRadius="12dp"
                                      style="@style/Widget.Material3.Button.TonalButton"/>
                              </LinearLayout>
                          </LinearLayout>
                      </com.google.android.material.card.MaterialCardView>

                      <com.google.android.material.card.MaterialCardView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          app:cardCornerRadius="22dp"
                          app:cardElevation="0dp"
                          app:strokeWidth="1dp"
                          app:strokeColor="@color/card_stroke"
                          app:cardBackgroundColor="@color/card_background"
                          android:layout_marginBottom="14dp">

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:padding="20dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="@string/input_card_title"
                                  android:textStyle="bold"
                                  android:textSize="15sp"
                                  android:textColor="@color/text_primary"
                                  android:layout_marginBottom="4dp"/>

                              <TextView
                                  android:id="@+id/tvInputPath"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="@string/no_file_selected"
                                  android:textSize="12sp"
                                  android:textColor="@color/text_secondary"
                                  android:layout_marginBottom="14dp"/>

                              <com.google.android.material.button.MaterialButton
                                  android:id="@+id/btnSelectInput"
                                  android:layout_width="match_parent"
                                  android:layout_height="52dp"
                                  android:text="@string/btn_browse_zip"
                                  app:cornerRadius="16dp"
                                  app:icon="@drawable/ic_folder_zip"
                                  style="@style/Widget.Material3.Button.TonalButton"/>
                          </LinearLayout>
                      </com.google.android.material.card.MaterialCardView>

                      <com.google.android.material.card.MaterialCardView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          app:cardCornerRadius="22dp"
                          app:cardElevation="0dp"
                          app:strokeWidth="1dp"
                          app:strokeColor="@color/card_stroke"
                          app:cardBackgroundColor="@color/card_background"
                          android:layout_marginBottom="16dp">

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:padding="20dp">

                              <TextView
