name: Build SoletteInspector APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Genera struttura progetto Android
        run: |
          mkdir -p app/src/main/java/com/imran/soletteinsp

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SoletteInspector"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.imran.soletteinsp"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.imran.soletteinsp"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />

              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />

              <application
                  android:allowBackup="true"
                  android:label="Solette Inspector"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/imran/soletteinsp/MainActivity.kt
          package com.imran.soletteinsp

          import android.Manifest
          import android.annotation.SuppressLint
          import android.bluetooth.*
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat

          class MainActivity : AppCompatActivity() {

              companion object {
                  const val MAC_LEFT = "FF:FF:11:B0:E1:57"
                  const val MAC_RIGHT = "FF:FF:11:B0:E5:5D"
              }

              private var bluetoothAdapter: BluetoothAdapter? = null
              private var gattLeft: BluetoothGatt? = null
              private var gattRight: BluetoothGatt? = null

              private lateinit var statusLeft: TextView
              private lateinit var statusRight: TextView
              private lateinit var logView: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val manager = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                  bluetoothAdapter = manager.adapter
                  setupUI()
                  checkPermissions()
              }

              private fun setupUI() {
                  val scroll = ScrollView(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(36, 36, 36, 36)
                  }

                  root.addView(makeHeader("ISPEZIONE SERVIZI GATT:"))
                  statusLeft = TextView(this).apply { text = "Soletta L: Disconnessa" }
                  statusRight = TextView(this).apply { text = "Soletta R: Disconnessa" }
                  root.addView(statusLeft)
                  root.addView(statusRight)

                  val rowConn = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  rowConn.addView(makeButton("Ispeziona L") { connectAndInspect(MAC_LEFT, true) })
                  rowConn.addView(makeButton("Ispeziona R") { connectAndInspect(MAC_RIGHT, false) })
                  rowConn.addView(makeButton("Disconnetti") {
                      gattLeft?.disconnect(); gattLeft?.close(); gattLeft = null
                      gattRight?.disconnect(); gattRight?.close(); gattRight = null
                      updateStatus(true, "Disconnessa")
                      updateStatus(false, "Disconnessa")
                  })
                  root.addView(rowConn)

                  root.addView(makeHeader("SERVIZI E CARATTERISTICHE TROVATE:").apply { setPadding(0, 32, 0, 8) })
                  logView = TextView(this).apply { text = "Pronto. Tocca 'Ispeziona'.\n"; textSize = 11f }
                  root.addView(logView)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun makeHeader(title: String) = TextView(this).apply {
                  text = title; textSize = 16f; setPadding(0, 12, 0, 8)
              }

              private fun makeButton(label: String, onClick: () -> Unit) = Button(this).apply {
                  text = label; textSize = 12f; gravity = Gravity.CENTER
                  layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                      setMargins(6, 6, 6, 6)
                  }
                  setOnClickListener { onClick() }
              }

              private fun checkPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      val perms = arrayOf(Manifest.permission.BLUETOOTH_CONNECT, Manifest.permission.BLUETOOTH_SCAN)
                      if (perms.any { ActivityCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }) {
                          ActivityCompat.requestPermissions(this, perms, 100)
                      }
                  }
              }

              @SuppressLint("MissingPermission")
              private fun connectAndInspect(mac: String, isLeft: Boolean) {
                  val adapter = bluetoothAdapter ?: return
                  val device = adapter.getRemoteDevice(mac)
                  updateStatus(isLeft, "Connessione in corso...")

                  val callback = object : BluetoothGattCallback() {
                      override fun onConnectionStateChange(gatt: BluetoothGatt, status: Int, newState: Int) {
                          if (newState == BluetoothProfile.STATE_CONNECTED) {
                              updateStatus(isLeft, "Scansione servizi...")
                              gatt.discoverServices()
                          } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                              updateStatus(isLeft, "Disconnessa")
                              gatt.close()
                          }
                      }

                      override fun onServicesDiscovered(gatt: BluetoothGatt, status: Int) {
                          if (status == BluetoothGatt.GATT_SUCCESS) {
                              updateStatus(isLeft, "Ispezionata con successo!")
                              val side = if (isLeft) "L" else "R"
                              log("\n=== DISPOSITIVO $side ($mac) ===")
                              for (service in gatt.services) {
                                  log("Servizio: ${service.uuid}")
                                  for (char in service.characteristics) {
                                      val props = mutableListOf<String>()
                                      if ((char.properties and BluetoothGattCharacteristic.PROPERTY_READ) != 0) props.add("READ")
                                      if ((char.properties and BluetoothGattCharacteristic.PROPERTY_WRITE) != 0) props.add("WRITE")
                                      if ((char.properties and BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) != 0) props.add("WRITE_NO_RESP")
                                      if ((char.properties and BluetoothGattCharacteristic.PROPERTY_NOTIFY) != 0) props.add("NOTIFY")
                                      if ((char.properties and BluetoothGattCharacteristic.PROPERTY_INDICATE) != 0) props.add("INDICATE")
                                      log("   └── Caratteristica: ${char.uuid} [${props.joinToString()}]")
                                  }
                              }
                              log("===============================\n")
                          }
                      }
                  }
                  val gatt = device.connectGatt(this, false, callback, BluetoothDevice.TRANSPORT_LE)
                  if (isLeft) gattLeft = gatt else gattRight = gatt
              }

              private fun updateStatus(isLeft: Boolean, text: String) {
                  runOnUiThread {
                      if (isLeft) statusLeft.text = "Soletta L: $text" else statusRight.text = "Soletta R: $text"
                  }
              }

              private fun log(msg: String) {
                  runOnUiThread { logView.append("$msg\n") }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  gattLeft?.disconnect(); gattLeft?.close()
                  gattRight?.disconnect(); gattRight?.close()
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoletteInspector-debug
          path: app/build/outputs/apk/debug/app-debug.apk
