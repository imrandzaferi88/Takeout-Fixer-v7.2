name: Build Takeout Fixer Studio APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Project Structure and Root Configs
        run: |
          mkdir -p app/src/main/java/com/imrandzaferi/takeoutfixer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/values-en

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TakeoutFixerStudio"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.imrandzaferi.takeoutfixer'
              compileSdk 34

              defaultConfig {
                  applicationId "com.imrandzaferi.takeoutfixer"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0 Pro"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.exifinterface:exifinterface:1.3.7'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

      - name: Generate AndroidManifest.xml
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.TakeoutFixerStudio">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="uiMode|locale|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".TakeoutFixerService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

              </application>

          </manifest>
          EOF

      - name: Generate Liquid Glass Drawables and Values (Day & Night + Localization)
        run: |
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="liquid_bg_start">#DCEEFF</color>
              <color name="liquid_bg_center">#EBF4FF</color>
              <color name="liquid_bg_end">#CFE2FF</color>
              <color name="glass_surface">#D9FFFFFF</color>
              <color name="glass_pill_surface">#B3FFFFFF</color>
              <color name="glass_stroke">#99FFFFFF</color>
              <color name="glass_text_primary">#0F172A</color>
              <color name="glass_text_secondary">#475569</color>
              <color name="glass_accent">#007AFF</color>
              <color name="glass_accent_text">#FFFFFF</color>
              <color name="console_bg">#1A0F172A</color>
              <color name="console_text">#0B5394</color>
              <color name="status_ok">#15803D</color>
              <color name="status_warn">#B45309</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values-night/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="liquid_bg_start">#04060A</color>
              <color name="liquid_bg_center">#0B1320</color>
              <color name="liquid_bg_end">#071B26</color>
              <color name="glass_surface">#D9181C26</color>
              <color name="glass_pill_surface">#CC1E2433</color>
              <color name="glass_stroke">#4D80E5FF</color>
              <color name="glass_text_primary">#F8FAFC</color>
              <color name="glass_text_secondary">#94A3B8</color>
              <color name="glass_accent">#00E5FF</color>
              <color name="glass_accent_text">#041016</color>
              <color name="console_bg">#9905080D</color>
              <color name="console_text">#67E8F9</color>
              <color name="status_ok">#4ADE80</color>
              <color name="status_warn">#FBBF24</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.TakeoutFixerStudio" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/glass_accent</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values-night/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.TakeoutFixerStudio" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/glass_accent</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_liquid_gradient.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="135"
                  android:startColor="@color/liquid_bg_start"
                  android:centerColor="@color/liquid_bg_center"
                  android:endColor="@color/liquid_bg_end"
                  android:type="linear" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_glass_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="@color/glass_surface" />
              <corners android:radius="24dp" />
              <stroke
                  android:width="1.2dp"
                  android:color="@color/glass_stroke" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_glass_pill.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="@color/glass_pill_surface" />
              <corners android:radius="50dp" />
              <stroke
                  android:width="1dp"
                  android:color="@color/glass_stroke" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_console_box.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="@color/console_bg" />
              <corners android:radius="16dp" />
              <stroke
                  android:width="1dp"
                  android:color="@color/glass_stroke" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Takeout Fixer Studio</string>
              <string name="app_subtitle">v1.0 Pro - Liquid Glass Engine</string>
              <string name="tab_takeout">Takeout</string>
              <string name="tab_converter">Convertitore</string>
              <string name="tab_editor">Ritocco</string>
              <string name="takeout_title">Motore Google Takeout</string>
              <string name="takeout_desc">Unisci JSON ed EXIF, organizza in Anno/Mese e genera uno ZIP pulito in background.</string>
              <string name="select_zip_input">1. Seleziona ZIP Google Takeout</string>
              <string name="select_zip_output">2. Scegli Destinazione ZIP Pulito</string>
              <string name="no_file_selected">Nessun file selezionato</string>
              <string name="start_takeout_engine">Avvia Elaborazione Takeout</string>
              <string name="console_ready">Sistema pronto. Seleziona archivio di input e file di output.</string>
              <string name="converter_title">Convertitore Multimediale</string>
              <string name="converter_desc">Estrai traccia audio da video MP4 o converti file multimediali in formato audio.</string>
              <string name="select_media_btn">Seleziona Video o Audio</string>
              <string name="convert_media_btn">Estrai e Salva Audio</string>
              <string name="converter_idle">In attesa di un file multimediale.</string>
              <string name="editor_title">Studio Ritocco Immagini</string>
              <string name="editor_desc">Ruota, applica filtro monocromatico ed esporta in alta qualita.</string>
              <string name="select_image_btn">Carica Immagine</string>
              <string name="rotate_90_btn">Ruota 90°</string>
              <string name="filter_bw_btn">Bianco e Nero</string>
              <string name="reset_img_btn">Ripristina</string>
              <string name="save_image_btn">Esporta JPG</string>
              <string name="perm_modal_title">Configurazione Permessi</string>
              <string name="perm_modal_desc">Per elaborare archivi pesanti a schermo spento sono necessari i seguenti permessi.</string>
              <string name="perm_step1_title">Step 1: Notifiche Live</string>
              <string name="perm_step1_btn">Attiva Notifiche</string>
              <string name="perm_step2_title">Step 2: Batteria Senza Restrizioni</string>
              <string name="perm_step2_btn">Esenta Batteria</string>
              <string name="perm_granted">Concesso</string>
              <string name="perm_missing">Richiesto</string>
              <string name="perm_continue">Chiudi finestra</string>
              <string name="settings_title">Impostazioni Studio</string>
              <string name="setting_folder_title">Cartella di Default</string>
              <string name="setting_folder_btn">Cambia Cartella Predefinita</string>
              <string name="setting_theme_title">Aspetto e Tema</string>
              <string name="theme_system">Sistema</string>
              <string name="theme_light">Chiaro</string>
              <string name="theme_dark">Scuro</string>
              <string name="setting_lang_title">Lingua Applicazione</string>
              <string name="lang_it">Italiano</string>
              <string name="lang_en">English</string>
              <string name="setting_author_btn">Autore dell applicazione</string>
              <string name="author_dialog_title">Crediti Sviluppatore</string>
              <string name="author_dialog_message">Takeout Fixer Studio v1.0 Pro\nSviluppato da: Imran Dzaferi\nArchitettura: Kotlin Native Liquid Glass</string>
              <string name="ok_btn">Chiudi</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values-en/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Takeout Fixer Studio</string>
              <string name="app_subtitle">v1.0 Pro - Liquid Glass Engine</string>
              <string name="tab_takeout">Takeout</string>
              <string name="tab_converter">Converter</string>
              <string name="tab_editor">Retouch</string>
              <string name="takeout_title">Google Takeout Engine</string>
              <string name="takeout_desc">Merge JSON metadata into EXIF, sort into Year/Month folders and build a clean ZIP.</string>
              <string name="select_zip_input">1. Select Google Takeout ZIP</string>
              <string name="select_zip_output">2. Choose Clean Output ZIP</string>
              <string name="no_file_selected">No file selected</string>
              <string name="start_takeout_engine">Start Takeout Processing</string>
              <string name="console_ready">System ready. Select input archive and output destination.</string>
              <string name="converter_title">Media Converter</string>
              <string name="converter_desc">Extract audio stream from MP4 video or convert media files to audio output.</string>
              <string name="select_media_btn">Select Video or Audio</string>
              <string name="convert_media_btn">Extract and Save Audio</string>
              <string name="converter_idle">Waiting for media file selection.</string>
              <string name="editor_title">Image Retouch Studio</string>
              <string name="editor_desc">Rotate, apply monochrome filter and export high quality JPEG.</string>
              <string name="select_image_btn">Load Image</string>
              <string name="rotate_90_btn">Rotate 90°</string>
              <string name="filter_bw_btn">Black and White</string>
              <string name="reset_img_btn">Reset</string>
              <string name="save_image_btn">Export JPG</string>
              <string name="perm_modal_title">Permissions Setup</string>
              <string name="perm_modal_desc">To process large archives with the screen off, please grant both permissions below.</string>
              <string name="perm_step1_title">Step 1: Live Notifications</string>
              <string name="perm_step1_btn">Enable Notifications</string>
              <string name="perm_step2_title">Step 2: Unrestricted Battery</string>
              <string name="perm_step2_btn">Exempt Battery</string>
              <string name="perm_granted">Granted</string>
              <string name="perm_missing">Required</string>
              <string name="perm_continue">Close dialog</string>
              <string name="settings_title">Studio Settings</string>
              <string name="setting_folder_title">Default Folder</string>
              <string name="setting_folder_btn">Change Default Folder</string>
              <string name="setting_theme_title">Appearance and Theme</string>
              <string name="theme_system">System</string>
              <string name="theme_light">Light</string>
              <string name="theme_dark">Dark</string>
              <string name="setting_lang_title">App Language</string>
              <string name="lang_it">Italiano</string>
              <string name="lang_en">English</string>
              <string name="setting_author_btn">Application Author</string>
              <string name="author_dialog_title">Developer Credits</string>
              <string name="author_dialog_message">Takeout Fixer Studio v1.0 Pro\nDeveloped by: Imran Dzaferi\nArchitecture: Kotlin Native Liquid Glass</string>
              <string name="ok_btn">Close</string>
          </resources>
          EOF

      - name: Generate XML Layouts (Main UI, Permissions Modal, Settings BottomSheet)
        run: |
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/bg_liquid_gradient"
              android:paddingTop="16dp">

              <!-- Top Header Bar -->
              <RelativeLayout
                  android:id="@+id/headerBar"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginHorizontal="16dp"
                  android:layout_marginBottom="12dp"
                  android:background="@drawable/bg_glass_card"
                  android:paddingHorizontal="20dp"
                  android:paddingVertical="14dp">

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_alignParentStart="true"
                      android:layout_centerVertical="true"
                      android:orientation="vertical">

                      <TextView
                          android:id="@+id/tvAppTitle"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="@string/app_name"
                          android:textColor="@color/glass_text_primary"
                          android:textSize="20sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/tvAppSubtitle"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="@string/app_subtitle"
                          android:textColor="@color/glass_text_secondary"
                          android:textSize="12sp" />
                  </LinearLayout>

                  <ImageButton
                      android:id="@+id/btnSettingsMenu"
                      android:layout_width="42dp"
                      android:layout_height="42dp"
                      android:layout_alignParentEnd="true"
                      android:layout_centerVertical="true"
                      android:background="@drawable/bg_glass_pill"
                      android:contentDescription="@string/settings_title"
                      android:src="@android:drawable/ic_menu_more"
                      android:tint="@color/glass_text_primary" />
              </RelativeLayout>

              <!-- Content Container -->
              <FrameLayout
                  android:id="@+id/contentContainer"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_above="@+id/bottomGlassBar"
                  android:layout_below="@id/headerBar">

                  <!-- TAB 1: TAKEOUT -->
                  <ScrollView
                      android:id="@+id/layoutTabTakeout"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:paddingHorizontal="16dp"
                      android:visibility="visible">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:paddingBottom="24dp">

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:background="@drawable/bg_glass_card"
                              android:orientation="vertical"
                              android:padding="20dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="@string/takeout_title"
                                  android:textColor="@color/glass_text_primary"
                                  android:textSize="18sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="4dp"
                                  android:text="@string/takeout_desc"
                                  android:textColor="@color/glass_text_secondary"
                                  android:textSize="13sp" />

                              <Button
                                  android:id="@+id/btnSelectZip"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="16dp"
                                  android:backgroundTint="@color/glass_accent"
                                  android:text="@string/select_zip_input"
                                  android:textColor="@color/glass_accent_text" />

                              <TextView
                                  android:id="@+id/tvSelectedZip"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="6dp"
                                  android:text="@string/no_file_selected"
                                  android:textColor="@color/glass_text_secondary"
                                  android:textSize="12sp" />

                              <Button
                                  android:id="@+id/btnSelectOutputZip"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="12dp"
                                  android:backgroundTint="@color/glass_accent"
                                  android:text="@string/select_zip_output"
                                  android:textColor="@color/glass_accent_text" />

                              <TextView
                                  android:id="@+id/tvSelectedOutputZip"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="6dp"
                                  android:text="@string/no_file_selected"
                                  android:textColor="@color/glass_text_secondary"
                                  android:textSize="12sp" />

                              <Button
                                  android:id="@+id/btnStartTakeout"
                                  android:layout_width="match_parent"
                                  android:layout_height="54dp"
                                  android:layout_marginTop="18dp"
                                  android:backgroundTint="@color/glass_accent"
                                  android:text="@string/start_takeout_engine"
                                  android:textColor="@color/glass_accent_text"
                                  android:textStyle="bold" />

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="16dp"
                                  android:gravity="center_vertical"
                                  android:orientation="horizontal">

                                  <ProgressBar
                                      android:id="@+id/progressTakeout"
                                      style="?android:attr/progressBarStyleHorizontal"
                                      android:layout_width="0dp"
                                      android:layout_height="10dp"
                                      android:layout_weight="1"
                                      android:max="100"
                                      android:progress="0" />

                                  <TextView
                                      android:id="@+id/tvProgressPercent"
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:layout_marginStart="12dp"
                                      android:text="0%"
                                      android:textColor="@color/glass_text_primary"
                                      android:textStyle="bold" />
                              </LinearLayout>

                              <ScrollView
                                  android:id="@+id/scrollConsole"
                                  android:layout_width="match_parent"
                                  android:layout_height="170dp"
                                  android:layout_marginTop="14dp"
                                  android:background="@drawable/bg_console_box"
                                  android:padding="12dp">

                                  <TextView
                                      android:id="@+id/tvConsoleLog"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:fontFamily="monospace"
                                      android:text="@string/console_ready"
                                      android:textColor="@color/console_text"
                                      android:textSize="12sp" />
                              </ScrollView>
                          </LinearLayout>
                      </LinearLayout>
                  </ScrollView>

                  <!-- TAB 2: MEDIA CONVERTER -->
                  <ScrollView
                      android:id="@+id/layoutTabConverter"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:paddingHorizontal="16dp"
                      android:visibility="gone">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="@drawable/bg_glass_card"
                          android:orientation="vertical"
                          android:padding="20dp">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="@string/converter_title"
                              android:textColor="@color/glass_text_primary"
                              android:textSize="18sp"
                              android:textStyle="bold" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="4dp"
                              android:text="@string/converter_desc"
                              android:textColor="@color/glass_text_secondary"
                              android:textSize="13sp" />

                          <Button
                              android:id="@+id/btnSelectMedia"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="16dp"
                              android:backgroundTint="@color/glass_accent"
                              android:text="@string/select_media_btn"
                              android:textColor="@color/glass_accent_text" />

                          <TextView
                              android:id="@+id/tvSelectedMedia"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="8dp"
                              android:text="@string/no_file_selected"
                              android:textColor="@color/glass_text_secondary"
                              android:textSize="12sp" />

                          <Button
                              android:id="@+id/btnConvertMedia"
                              android:layout_width="match_parent"
                              android:layout_height="54dp"
                              android:layout_marginTop="16dp"
                              android:backgroundTint="@color/glass_accent"
                              android:text="@string/convert_media_btn"
                              android:textColor="@color/glass_accent_text"
                              android:textStyle="bold" />

                          <ProgressBar
                              android:id="@+id/progressConverter"
                              style="?android:attr/progressBarStyleHorizontal"
