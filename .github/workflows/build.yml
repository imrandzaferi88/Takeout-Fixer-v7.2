name: Build TakeoutFixer v9.0 Studio

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Genera sorgenti v9.0
        run: |
          mkdir -p app/src/main/java/com/takeout/fixer
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-en
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TakeoutFixer"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.takeout.fixer'
              compileSdk 34

              defaultConfig {
                  applicationId "com.takeout.fixer"
                  minSdk 26
                  targetSdk 34
                  versionCode 10
                  versionName "9.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.exifinterface:exifinterface:1.3.7'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="glass_bg_gradient_start">#EAF2FC</color>
              <color name="glass_bg_gradient_end">#DCE7F7</color>
              <color name="glass_card_surface">#D9FFFFFF</color>
              <color name="glass_card_stroke">#80FFFFFF</color>
              <color name="glass_inner_box">#66F1F5FB</color>
              <color name="glass_primary">#007AFF</color>
              <color name="glass_on_primary">#FFFFFF</color>
              <color name="glass_primary_pill">#26007AFF</color>
              <color name="text_primary">#1C1C1E</color>
              <color name="text_secondary">#48484A</color>
              <color name="text_tertiary">#8E8E93</color>
              <color name="glass_console">#D91E222A</color>
              <color name="glass_console_text">#64D2FF</color>
              <color name="accent_green">#34C759</color>
              <color name="accent_amber">#FF9500</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values-night/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="glass_bg_gradient_start">#090B10</color>
              <color name="glass_bg_gradient_end">#121520</color>
              <color name="glass_card_surface">#D9181C26</color>
              <color name="glass_card_stroke">#33FFFFFF</color>
              <color name="glass_inner_box">#4D202636</color>
              <color name="glass_primary">#0A84FF</color>
              <color name="glass_on_primary">#FFFFFF</color>
              <color name="glass_primary_pill">#330A84FF</color>
              <color name="text_primary">#F2F2F7</color>
              <color name="text_secondary">#AEAEB2</color>
              <color name="text_tertiary">#8E8E93</color>
              <color name="glass_console">#E60D0F15</color>
              <color name="glass_console_text">#64D2FF</color>
              <color name="accent_green">#30D158</color>
              <color name="accent_amber">#FF9F0A</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.TakeoutFixer" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/glass_primary</item>
                  <item name="colorOnPrimary">@color/glass_on_primary</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="bottomSheetDialogTheme">@style/GlassBottomSheetDialog</item>
              </style>

              <style name="GlassBottomSheetDialog" parent="ThemeOverlay.Material3.BottomSheetDialog">
                  <item name="bottomSheetStyle">@style/GlassBottomSheetModal</item>
              </style>

              <style name="GlassBottomSheetModal" parent="Widget.Material3.BottomSheet.Modal">
                  <item name="backgroundTint">@android:color/transparent</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Takeout Fixer</string>
              <string name="app_version">v9.0 Glass</string>
              <string name="tab_takeout">Takeout</string>
              <string name="tab_converter">Converti</string>
              <string name="tab_retouch">Ritocco</string>
              <string name="initial_setup_title">Permessi Richiesti</string>
              <string name="setup_desc">Attiva questi permessi per elaborare in background:</string>
              <string name="step_notif_title">Notifiche live</string>
              <string name="step_battery_title">Ottimizzazione batteria</string>
              <string name="btn_activate">Attiva</string>
              <string name="btn_set">Imposta</string>
              <string name="input_card_title">Archivio Takeout</string>
              <string name="no_file_selected">Nessun file selezionato</string>
              <string name="btn_browse_zip">Scegli file ZIP</string>
              <string name="output_card_title">Elaborazione e Destinazione</string>
              <string name="output_desc">Organizza in Anno e Mese con metadati EXIF e GPS inclusi.</string>
              <string name="btn_start">Salva e Avvia</string>
              <string name="ready">Pronto all uso</string>
              <string name="system_log">Console di Sistema</string>
              <string name="init_complete">Takeout Fixer v9.0 avviato con successo.</string>
              <string name="settings">Impostazioni</string>
              <string name="change_language">Lingua</string>
              <string name="change_theme">Aspetto e Tema</string>
              <string name="default_folder">Cartella predefinita</string>
              <string name="about_creator">Autore dell app</string>
              <string name="theme_system">Segui sistema</string>
              <string name="theme_light">Glass Chiaro</string>
              <string name="theme_dark">Glass Scuro</string>
              <string name="close">Chiudi</string>
              <string name="conv_title">Convertitore Multimediale</string>
              <string name="conv_desc">Estrai traccia audio da file video:</string>
              <string name="btn_select_media">Scegli Video o Audio</string>
              <string name="btn_convert_now">Converti ed Estrai Audio</string>
              <string name="retouch_title">Studio Ritocco Immagini</string>
              <string name="retouch_desc">Regola ed esporta le tue foto:</string>
              <string name="btn_select_img">Scegli Immagine</string>
              <string name="btn_rotate">Ruota 90</string>
              <string name="btn_filter_bw">Filtro Bianco e Nero</string>
              <string name="btn_save_img">Esporta Immagine</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values-en/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Takeout Fixer</string>
              <string name="app_version">v9.0 Glass</string>
              <string name="tab_takeout">Takeout</string>
              <string name="tab_converter">Convert</string>
              <string name="tab_retouch">Retouch</string>
              <string name="initial_setup_title">Permissions Required</string>
              <string name="setup_desc">Enable permissions for smooth background execution:</string>
              <string name="step_notif_title">Live Notifications</string>
              <string name="step_battery_title">Battery Optimization</string>
              <string name="btn_activate">Enable</string>
              <string name="btn_set">Set</string>
              <string name="input_card_title">Takeout Archive</string>
              <string name="no_file_selected">No file selected</string>
              <string name="btn_browse_zip">Choose ZIP File</string>
              <string name="output_card_title">Processing Target</string>
              <string name="output_desc">Sort into Year and Month with embedded EXIF and GPS metadata.</string>
              <string name="btn_start">Save and Start</string>
              <string name="ready">Ready to process</string>
              <string name="system_log">System Console</string>
              <string name="init_complete">Takeout Fixer v9.0 initialized.</string>
              <string name="settings">Settings</string>
              <string name="change_language">Language</string>
              <string name="change_theme">App Appearance</string>
              <string name="default_folder">Default Folder</string>
              <string name="about_creator">App Author</string>
              <string name="theme_system">Follow system</string>
              <string name="theme_light">Glass Light</string>
              <string name="theme_dark">Glass Dark</string>
              <string name="close">Close</string>
              <string name="conv_title">Media Converter</string>
              <string name="conv_desc">Extract audio track from video file:</string>
              <string name="btn_select_media">Choose Video or Audio</string>
              <string name="btn_convert_now">Convert and Extract Audio</string>
              <string name="retouch_title">Image Retouch Studio</string>
              <string name="retouch_desc">Edit, enhance and export your photos:</string>
              <string name="btn_select_img">Choose Picture</string>
              <string name="btn_rotate">Rotate 90</string>
              <string name="btn_filter_bw">Black and White Filter</string>
              <string name="btn_save_img">Export Picture</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_liquid_gradient.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:type="linear"
                  android:angle="135"
                  android:startColor="@color/glass_bg_gradient_start"
                  android:endColor="@color/glass_bg_gradient_end"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_glass_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/glass_card_surface"/>
              <stroke
                  android:width="1.5dp"
                  android:color="@color/glass_card_stroke"/>
              <corners android:radius="26dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_glass_sheet.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/glass_card_surface"/>
              <stroke
                  android:width="1.5dp"
                  android:color="@color/glass_card_stroke"/>
              <corners
                  android:topLeftRadius="32dp"
                  android:topRightRadius="32dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_glass_pill.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/glass_inner_box"/>
              <stroke
                  android:width="1dp"
                  android:color="@color/glass_card_stroke"/>
              <corners android:radius="18dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#007AFF"
                  android:pathData="M24,24h60c7,0 13,6 13,13v34c0,7 -6,13 -13,13H24c-7,0 -13,-6 -13,-13V37c0,-7 6,-13 13,-13z"/>
              <path
                  android:fillColor="#E6FFFFFF"
                  android:pathData="M34,36h40c3.5,0 6.5,3 6.5,6.5v23c0,3.5 -3,6.5 -6.5,6.5H34c-3.5,0 -6.5,-3 -6.5,-6.5V42.5c0,-3.5 3,-6.5 6.5,-6.5z"/>
              <path
                  android:fillColor="#FF9500"
                  android:pathData="M44,48m-5,0a5,5 0,1 1,10 0a5,5 0,1 1,-10 0"/>
              <path
                  android:fillColor="#34C759"
                  android:pathData="M36,66l11,-15 9,12 8,-9 14,12z"/>
              <path
                  android:fillColor="#0051B3"
                  android:pathData="M64,30l6,6h-5c0,7.7 -6.3,14 -14,14 -2.5,0 -4.8,-0.7 -6.8,-1.8l2.4,-2.4c1.3,0.5 2.8,0.8 4.4,0.8 5.9,0 10.7,-4.8 10.7,-10.6h-4.7l7,-6z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/glass_primary"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_more_vert.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#8E8E93"
                  android:pathData="M12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,10c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2zM12,16c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_folder_zip.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#007AFF"
                  android:pathData="M20,6h-8l-2,-2H4C2.9,4 2,4.9 2,6v12c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V8C22,6.9 21.1,6 20,6zM18,12h-2v2h2v2h-2v2h-2v-2h2v-2h-2v-2h2v-2h-2V8h2V12z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_check_circle.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#34C759"
                  android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM10,17l-5,-5 1.41,-1.41L10,14.17l7.59,-7.59L19,8l-9,9z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_security.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#007AFF"
                  android:pathData="M12,1L3,5v6c0,5.55 3.84,10.74 9,12 5.16,-1.26 9,-6.45 9,-12V5l-9,-4zm0,10.99h7c-.53,4.12 -3.28,7.79 -7,8.94V12H5V6.3l7,-3.11v8.8z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/layout/dialog_glass_permissions.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:background="@drawable/bg_glass_card"
              android:padding="24dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:layout_marginBottom="12dp">
                  <ImageView
                      android:layout_width="26dp"
                      android:layout_height="26dp"
                      android:src="@drawable/ic_security"
                      android:layout_marginEnd="10dp"/>
                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="@string/initial_setup_title"
                      android:textSize="18sp"
                      android:textStyle="bold"
                      android:textColor="@color/text_primary"/>
              </LinearLayout>

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="@string/setup_desc"
                  android:textSize="13sp"
                  android:textColor="@color/text_secondary"
                  android:layout_marginBottom="16dp"/>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:background="@drawable/bg_glass_pill"
                  android:padding="12dp"
                  android:layout_marginBottom="10dp">
                  <TextView
                      android:id="@+id/dlgIconNotif"
                      android:layout_width="24dp"
                      android:layout_height="24dp"
                      android:gravity="center"
                      android:text="1"
                      android:textStyle="bold"
                      android:textColor="@color/glass_primary"
                      android:layout_marginEnd="10dp"/>
                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="@string/step_notif_title"
                      android:textStyle="bold"
                      android:textSize="13sp"
                      android:textColor="@color/text_primary"/>
                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/dlgBtnNotif"
                      android:layout_width="wrap_content"
                      android:layout_height="36dp"
                      android:text="@string/btn_activate"
                      android:textSize="12sp"
                      app:cornerRadius="12dp"
                      style="@style/Widget.Material3.Button.TonalButton"/>
              </LinearLayout>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:background="@drawable/bg_glass_pill"
                  android:padding="12dp"
                  android:layout_marginBottom="20dp">
                  <TextView
                      android:id="@+id/dlgIconBattery"
                      android:layout_width="24dp"
                      android:layout_height="24dp"
                      android:gravity="center"
                      android:text="2"
                      android:textStyle="bold"
                      android:textColor="@color/glass_primary"
                      android:layout_marginEnd="10dp"/>
                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="@string/step_battery_title"
                      android:textStyle="bold"
                      android:textSize="13sp"
                      android:textColor="@color/text_primary"/>
                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/dlgBtnBattery"
                      android:layout_width="wrap_content"
                      android:layout_height="36dp"
                      android:text="@string/btn_set"
                      android:textSize="12sp"
                      app:cornerRadius="12dp"
                      style="@style/Widget.Material3.Button.TonalButton"/>
              </LinearLayout>

              <com.google.android.material.button.MaterialButton
                  android:id="@+id/dlgBtnClose"
                  android:layout_width="match_parent"
                  android:layout_height="48dp"
                  android:text="@string/close"
                  app:cornerRadius="14dp"
                  style="@style/Widget.Material3.Button"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/layout_glass_sheet.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:background="@drawable/bg_glass_sheet"
              android:padding="24dp">

              <View
                  android:layout_width="38dp"
                  android:layout_height="5dp"
                  android:background="#4D8E8E93"
                  android:layout_gravity="center_horizontal"
                  android:layout_marginBottom="20dp"/>

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="@string/settings"
                  android:textSize="20sp"
                  android:textStyle="bold"
                  android:textColor="@color/text_primary"
                  android:layout_marginBottom="16dp"/>

              <LinearLayout
                  android:id="@+id/sheetOptFolder"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:gravity="center_vertical"
                  android:background="@drawable/bg_glass_pill"
                  android:paddingHorizontal="16dp"
                  android:layout_marginBottom="10dp"
                  android:clickable="true"
                  android:focusable="true">
                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="@string/default_folder"
                      android:textSize="15sp"
                      android:textColor="@color/text_primary"/>
                  <ImageView
                      android:layout_width="20dp"
                      android:layout_height="20dp"
                      android:src="@drawable/ic_folder_zip"/>
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/sheetOptTheme"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:gravity="center_vertical"
                  android:background="@drawable/bg_glass_pill"
                  android:paddingHorizontal="16dp"
                  android:layout_marginBottom="10dp"
                  android:clickable="true"
                  android:focusable="true">
                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="@string/change_theme"
                      android:textSize="15sp"
                      android:textColor="@color/text_primary"/>
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Glass"
                      android:textSize="12sp"
                      android:textStyle="bold"
                      android:textColor="@color/glass_primary"/>
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/sheetOptLanguage"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:gravity="center_vertical"
                  android:background="@drawable/bg_glass_pill"
                  android:paddingHorizontal="16dp"
                  android:layout_marginBottom="10dp"
                  android:clickable="true"
                  android:focusable="true">
                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="@string/change_language"
                      android:textSize="15sp"
                      android:textColor="@color/text_primary"/>
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="IT / EN"
                      android:textSize="12sp"
                      android:textStyle="bold"
                      android:textColor="@color/glass_primary"/>
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/sheetOptCreator"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
