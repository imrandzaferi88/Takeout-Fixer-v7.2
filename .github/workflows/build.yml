                      val matrix = Matrix().apply { postRotate(90f) }
                      workingBitmap = Bitmap.createBitmap(
                          current, 0, 0, current.width, current.height, matrix, true
                      )
                      ivEditorPreview.setImageBitmap(workingBitmap)
                  }

                  findViewById<Button>(R.id.btnFilterBw).setOnClickListener {
                      val current = workingBitmap ?: return@setOnClickListener
                      val bwBitmap = Bitmap.createBitmap(
                          current.width,
                          current.height,
                          Bitmap.Config.ARGB_8888
                      )
                      val canvas = Canvas(bwBitmap)
                      val cm = ColorMatrix().apply { setSaturation(0f) }
                      val paint = Paint().apply { colorFilter = ColorMatrixColorFilter(cm) }
                      canvas.drawBitmap(current, 0f, 0f, paint)
                      workingBitmap = bwBitmap
                      ivEditorPreview.setImageBitmap(workingBitmap)
                  }

                  findViewById<Button>(R.id.btnResetImage).setOnClickListener {
                      originalBitmap?.let {
                          workingBitmap = it.copy(Bitmap.Config.ARGB_8888, true)
                          ivEditorPreview.setImageBitmap(workingBitmap)
                      }
                  }

                  findViewById<Button>(R.id.btnSaveImage).setOnClickListener {
                      if (workingBitmap == null) {
                          Toast.makeText(this, getString(R.string.no_file_selected), Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      saveEditedImageLauncher.launch("Retouched_${System.currentTimeMillis()}.jpg")
                  }
              }

              private fun loadBitmapFromUri(uri: Uri) {
                  lifecycleScope.launch(Dispatchers.IO) {
                      try {
                          contentResolver.openInputStream(uri)?.use { stream ->
                              val decoded = BitmapFactory.decodeStream(stream)
                              if (decoded != null) {
                                  originalBitmap = decoded
                                  workingBitmap = decoded.copy(Bitmap.Config.ARGB_8888, true)
                                  withContext(Dispatchers.Main) {
                                      ivEditorPreview.setImageBitmap(workingBitmap)
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) {
                              Toast.makeText(this@MainActivity, "Errore caricamento immagine", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }

              private fun saveCurrentBitmapToUri(uri: Uri) {
                  val bmp = workingBitmap ?: return
                  lifecycleScope.launch(Dispatchers.IO) {
                      try {
                          contentResolver.openOutputStream(uri)?.use { out ->
                              bmp.compress(Bitmap.CompressFormat.JPEG, 95, out)
                          }
                          withContext(Dispatchers.Main) {
                              Toast.makeText(this@MainActivity, "Immagine JPG esportata!", Toast.LENGTH_SHORT).show()
                          }
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) {
                              Toast.makeText(this@MainActivity, "Errore salvataggio JPG", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }

              private fun isNotificationPermGranted(): Boolean {
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.POST_NOTIFICATIONS
                      ) == PackageManager.PERMISSION_GRANTED
                  } else {
                      true
                  }
              }

              private fun isBatteryOptimizationIgnored(): Boolean {
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  return pm.isIgnoringBatteryOptimizations(packageName)
              }

              private fun checkAndShowPermissionsModal() {
                  if (isNotificationPermGranted() && isBatteryOptimizationIgnored()) {
                      return
                  }

                  val dialog = Dialog(this)
                  dialog.requestWindowFeature(Window.FEATURE_NO_TITLE)
                  dialog.setContentView(R.layout.dialog_glass_permissions)
                  dialog.window?.setBackgroundDrawable(ColorDrawable(Color.TRANSPARENT))
                  dialog.setCancelable(false)

                  dialogTvNotifStatus = dialog.findViewById(R.id.tvPermNotificationStatus)
                  dialogTvBatteryStatus = dialog.findViewById(R.id.tvPermBatteryStatus)
                  dialogBtnNotif = dialog.findViewById(R.id.btnPermNotifications)
                  dialogBtnBattery = dialog.findViewById(R.id.btnPermBattery)

                  dialogBtnNotif?.setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          notificationPermissionLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)
                      } else {
                          refreshPermissionDialogState()
                      }
                  }

                  dialogBtnBattery?.setOnClickListener {
                      try {
                          val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                              data = Uri.parse("package:$packageName")
                          }
                          startActivity(intent)
                      } catch (e: Exception) {
                          val fallback = Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)
                          startActivity(fallback)
                      }
                  }

                  dialog.findViewById<Button>(R.id.btnPermClose).setOnClickListener {
                      dialog.dismiss()
                  }

                  permissionsDialog = dialog
                  refreshPermissionDialogState()
                  dialog.show()
              }

              private fun refreshPermissionDialogState() {
                  val dialog = permissionsDialog ?: return
                  if (!dialog.isShowing && isNotificationPermGranted() && isBatteryOptimizationIgnored()) {
                      return
                  }

                  val notifOk = isNotificationPermGranted()
                  val battOk = isBatteryOptimizationIgnored()

                  val okColor = ContextCompat.getColor(this, R.color.status_ok)
                  val warnColor = ContextCompat.getColor(this, R.color.status_warn)

                  dialogTvNotifStatus?.apply {
                      text = if (notifOk) getString(R.string.perm_granted) else getString(R.string.perm_missing)
                      setTextColor(if (notifOk) okColor else warnColor)
                  }
                  dialogBtnNotif?.isEnabled = !notifOk

                  dialogTvBatteryStatus?.apply {
                      text = if (battOk) getString(R.string.perm_granted) else getString(R.string.perm_missing)
                      setTextColor(if (battOk) okColor else warnColor)
                  }
                  dialogBtnBattery?.isEnabled = !battOk

                  if (notifOk && battOk) {
                      dialog.dismiss()
                      permissionsDialog = null
                  }
              }

              private fun showGlassSettingsSheet() {
                  val sheet = BottomSheetDialog(this)
                  val view = layoutInflater.inflate(R.layout.layout_glass_sheet, null)
                  sheet.setContentView(view)
                  sheet.window?.findViewById<View>(com.google.android.material.R.id.design_bottom_sheet)
                      ?.setBackgroundColor(Color.TRANSPARENT)

                  val tvFolder = view.findViewById<TextView>(R.id.tvCurrentDefaultFolder)
                  val savedFolder = prefs.getString("default_folder_uri", null)
                  if (!savedFolder.isNullOrEmpty()) {
                      tvFolder.text = savedFolder
                  }

                  view.findViewById<Button>(R.id.btnSettingDefaultFolder).setOnClickListener {
                      pickDefaultFolderLauncher.launch(null)
                      sheet.dismiss()
                  }

                  view.findViewById<Button>(R.id.btnThemeSystem).setOnClickListener {
                      saveAndApplyTheme(AppCompatDelegate.MODE_NIGHT_FOLLOW_SYSTEM)
                      sheet.dismiss()
                  }

                  view.findViewById<Button>(R.id.btnThemeLight).setOnClickListener {
                      saveAndApplyTheme(AppCompatDelegate.MODE_NIGHT_NO)
                      sheet.dismiss()
                  }

                  view.findViewById<Button>(R.id.btnThemeDark).setOnClickListener {
                      saveAndApplyTheme(AppCompatDelegate.MODE_NIGHT_YES)
                      sheet.dismiss()
                  }

                  view.findViewById<Button>(R.id.btnLangIt).setOnClickListener {
                      AppCompatDelegate.setApplicationLocales(LocaleListCompat.forLanguageTags("it"))
                      sheet.dismiss()
                  }

                  view.findViewById<Button>(R.id.btnLangEn).setOnClickListener {
                      AppCompatDelegate.setApplicationLocales(LocaleListCompat.forLanguageTags("en"))
                      sheet.dismiss()
                  }

                  view.findViewById<Button>(R.id.btnSettingAuthor).setOnClickListener {
                      sheet.dismiss()
                      AlertDialog.Builder(this)
                          .setTitle(getString(R.string.author_dialog_title))
                          .setMessage(getString(R.string.author_dialog_message))
                          .setPositiveButton(getString(R.string.ok_btn), null)
                          .show()
                  }

                  sheet.show()
              }

              private fun saveAndApplyTheme(mode: Int) {
                  prefs.edit().putInt("theme_mode", mode).apply()
                  AppCompatDelegate.setDefaultNightMode(mode)
              }

              private fun applySavedTheme() {
                  val mode = prefs.getInt("theme_mode", AppCompatDelegate.MODE_NIGHT_FOLLOW_SYSTEM)
                  AppCompatDelegate.setDefaultNightMode(mode)
              }
          }
