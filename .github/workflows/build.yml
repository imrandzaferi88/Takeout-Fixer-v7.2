      - name: Generate Kotlin Sources (TakeoutFixerService.kt & MainActivity.kt)
        run: |
          cat << 'EOF' > app/src/main/java/com/imrandzaferi/takeoutfixer/TakeoutFixerService.kt
          package com.imrandzaferi.takeoutfixer

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.Uri
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat
          import androidx.exifinterface.media.ExifInterface
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch
          import org.json.JSONObject
          import java.io.BufferedOutputStream
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import java.util.zip.ZipEntry
          import java.util.zip.ZipInputStream
          import java.util.zip.ZipOutputStream

          data class GooglePhotoMeta(
              val timestampSec: Long,
              val latitude: Double?,
              val longitude: Double?,
              val description: String?
          )

          class TakeoutFixerService : Service() {

              companion object {
                  const val ACTION_START = "com.imrandzaferi.takeoutfixer.START"
                  const val ACTION_PROGRESS = "com.imrandzaferi.takeoutfixer.PROGRESS"
                  const val EXTRA_INPUT_URI = "extra_input_uri"
                  const val EXTRA_OUTPUT_URI = "extra_output_uri"
                  const val EXTRA_PROGRESS = "extra_progress"
                  const val EXTRA_LOG = "extra_log"
                  private const val CHANNEL_ID = "takeout_fixer_channel"
                  private const val NOTIF_ID = 1001
              }

              private val serviceScope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              private var wakeLock: PowerManager.WakeLock? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_START) {
                      val inputUriStr = intent.getStringExtra(EXTRA_INPUT_URI)
                      val outputUriStr = intent.getStringExtra(EXTRA_OUTPUT_URI)
                      if (inputUriStr != null && outputUriStr != null) {
                          startForegroundWithType(buildNotification("Avvio motore Takeout...", 0))
                          acquireWakeLock()
                          serviceScope.launch {
                              processTakeoutArchive(Uri.parse(inputUriStr), Uri.parse(outputUriStr))
                              releaseWakeLock()
                              stopForeground(STOP_FOREGROUND_REMOVE)
                              stopSelf()
                          }
                      }
                  }
                  return START_NOT_STICKY
              }

              private fun startForegroundWithType(notification: Notification) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(
                          NOTIF_ID,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC
                      )
                  } else {
                      startForeground(NOTIF_ID, notification)
                  }
              }

              private fun acquireWakeLock() {
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(
                      PowerManager.PARTIAL_WAKE_LOCK,
                      "TakeoutFixerStudio::EngineWakeLock"
                  ).apply {
                      acquire(60 * 60 * 1000L)
                  }
              }

              private fun releaseWakeLock() {
                  wakeLock?.let {
                      if (it.isHeld) it.release()
                  }
                  wakeLock = null
              }

              private fun processTakeoutArchive(inputUri: Uri, outputUri: Uri) {
                  try {
                      emitUpdate(2, "[INFO] Scansione preliminare metadati JSON in corso...")
                      val metadataMap = HashMap<String, GooglePhotoMeta>()
                      var mediaCount = 0

                      // Pass 1: Read JSON sidecars and count media files
                      contentResolver.openInputStream(inputUri)?.use { rawIn ->
                          ZipInputStream(rawIn).use { zis ->
                              var entry: ZipEntry? = zis.nextEntry
                              while (entry != null) {
                                  if (!entry.isDirectory) {
                                      val name = entry.name
                                      val baseName = File(name).name
                                      if (baseName.endsWith(".json", ignoreCase = true)) {
                                          val jsonBytes = readCurrentEntryBytes(zis)
                                          val parsed = parseGoogleJson(String(jsonBytes, Charsets.UTF_8))
                                          if (parsed != null) {
                                              val cleanKey = normalizeJsonTargetKey(baseName)
                                              metadataMap[cleanKey] = parsed
                                          }
                                      } else {
                                          mediaCount++
                                      }
                                  }
                                  zis.closeEntry()
                                  entry = zis.nextEntry
                              }
                          }
                      }

                      emitUpdate(15, "[OK] Metadati JSON indicizzati: ${metadataMap.size} | File multimediali: $mediaCount")

                      if (mediaCount == 0) {
                          emitUpdate(100, "[WARN] Nessun file multimediale trovato nello ZIP.")
                          return
                      }

                      var processedMedia = 0
                      val exifDateFormat = SimpleDateFormat("yyyy:MM:dd HH:mm:ss", Locale.US).apply {
                          timeZone = TimeZone.getDefault()
                      }
                      val folderDateFormat = SimpleDateFormat("yyyy/MM", Locale.US).apply {
                          timeZone = TimeZone.getDefault()
                      }

                      // Pass 2: Stream media files, inject EXIF, group into YYYY/MM, exclude JSONs
                      contentResolver.openInputStream(inputUri)?.use { rawIn ->
                          contentResolver.openOutputStream(outputUri)?.use { rawOut ->
                              ZipInputStream(rawIn).use { zis ->
                                  ZipOutputStream(BufferedOutputStream(rawOut)).use { zos ->
                                      val usedZipPaths = HashSet<String>()
                                      var entry: ZipEntry? = zis.nextEntry

                                      while (entry != null) {
                                          if (!entry.isDirectory) {
                                              val entryName = entry.name
                                              val fileName = File(entryName).name

                                              if (!fileName.endsWith(".json", ignoreCase = true)) {
                                                  processedMedia++
                                                  val meta = metadataMap[fileName.lowercase(Locale.ROOT)]
                                                  val ext = fileName.substringAfterLast('.', "").lowercase(Locale.ROOT)
                                                  val isExifSupported = ext == "jpg" || ext == "jpeg" || ext == "webp"

                                                  val tempFile = File(cacheDir, "temp_media_${System.currentTimeMillis()}_$fileName")
                                                  FileOutputStream(tempFile).use { fos ->
                                                      zis.copyTo(fos, 8192)
                                                  }

                                                  var finalTimestampMs = if (meta != null && meta.timestampSec > 0) {
                                                      meta.timestampSec * 1000L
                                                  } else if (entry.time > 0) {
                                                      entry.time
                                                  } else {
                                                      System.currentTimeMillis()
                                                  }

                                                  if (isExifSupported) {
                                                      try {
                                                          val exif = ExifInterface(tempFile.absolutePath)
                                                          if (meta != null) {
                                                              val formattedDate = exifDateFormat.format(Date(finalTimestampMs))
                                                              exif.setAttribute(ExifInterface.TAG_DATETIME_ORIGINAL, formattedDate)
                                                              exif.setAttribute(ExifInterface.TAG_DATETIME, formattedDate)
                                                              exif.setAttribute(ExifInterface.TAG_DATETIME_DIGITIZED, formattedDate)

                                                              if (meta.latitude != null && meta.longitude != null &&
                                                                  (meta.latitude != 0.0 || meta.longitude != 0.0)
                                                              ) {
                                                                  exif.setLatLong(meta.latitude, meta.longitude)
                                                              }
                                                              if (!meta.description.isNullOrBlank()) {
                                                                  exif.setAttribute(
                                                                      ExifInterface.TAG_IMAGE_DESCRIPTION,
                                                                      meta.description
                                                                  )
                                                              }
                                                              exif.saveAttributes()
                                                          } else {
                                                              val existingDate = exif.getAttribute(ExifInterface.TAG_DATETIME_ORIGINAL)
                                                              if (existingDate != null) {
                                                                  runCatching {
                                                                      exifDateFormat.parse(existingDate)?.time?.let {
                                                                          finalTimestampMs = it
                                                                      }
                                                                  }
                                                              }
                                                          }
                                                      } catch (e: Exception) {
                                                          emitUpdate(
                                                              calculateProgress(processedMedia, mediaCount),
                                                              "[WARN] EXIF non applicato su $fileName: ${e.message}"
                                                          )
                                                      }
                                                  }

                                                  val yearMonthFolder = folderDateFormat.format(Date(finalTimestampMs))
                                                  var targetZipPath = "$yearMonthFolder/$fileName"
                                                  var counter = 1
                                                  while (usedZipPaths.contains(targetZipPath)) {
                                                      val nameNoExt = fileName.substringBeforeLast('.')
                                                      val dotExt = if (ext.isNotEmpty()) ".$ext" else ""
                                                      targetZipPath = "$yearMonthFolder/${nameNoExt}_$counter$dotExt"
                                                      counter++
                                                  }
                                                  usedZipPaths.add(targetZipPath)

                                                  val newEntry = ZipEntry(targetZipPath).apply {
                                                      time = finalTimestampMs
                                                  }
                                                  zos.putNextEntry(newEntry)
                                                  FileInputStream(tempFile).use { fis ->
                                                      fis.copyTo(zos, 8192)
                                                  }
                                                  zos.closeEntry()
                                                  tempFile.delete()

                                                  val pct = calculateProgress(processedMedia, mediaCount)
                                                  updateNotification("Elaborato $processedMedia / $mediaCount", pct)
                                                  emitUpdate(pct, "[OK] -> $targetZipPath")
                                              }
                                          }
                                          zis.closeEntry()
                                          entry = zis.nextEntry
                                      }
                                  }
                              }
                          }
                      }

                      emitUpdate(100, "[COMPLETATO] Archivio ZIP pulito creato con successo ($processedMedia file).")
                  } catch (e: Exception) {
                      emitUpdate(100, "[ERRORE] ${e.localizedMessage ?: "Errore imprevisto"}")
                  }
              }

              private fun calculateProgress(done: Int, total: Int): Int {
                  return (15 + ((done.toFloat() / total.toFloat()) * 85f)).toInt().coerceIn(15, 100)
              }

              private fun normalizeJsonTargetKey(jsonFileName: String): String {
                  var cleaned = jsonFileName.removeSuffix(".json").removeSuffix(".JSON")
                  cleaned = cleaned.replace(".supplemental-metadata", "", ignoreCase = true)
                  return cleaned.lowercase(Locale.ROOT)
              }

              private fun parseGoogleJson(jsonString: String): GooglePhotoMeta? {
                  return try {
                      val root = JSONObject(jsonString)
                      val timestampSec = root.optJSONObject("photoTakenTime")
                          ?.optString("timestamp", "0")?.toLongOrNull() ?: 0L
                      val geo = root.optJSONObject("geoData")
                      val lat = geo?.optDouble("latitude", 0.0)
                      val lon = geo?.optDouble("longitude", 0.0)
                      val desc = root.optString("description", "").takeIf { it.isNotEmpty() }
                      GooglePhotoMeta(timestampSec, lat, lon, desc)
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun readCurrentEntryBytes(zis: ZipInputStream): ByteArray {
                  val baos = ByteArrayOutputStream()
                  val buffer = ByteArray(4096)
                  var count: Int
                  while (zis.read(buffer).also { count = it } != -1) {
                      baos.write(buffer, 0, count)
                  }
                  return baos.toByteArray()
              }

              private fun emitUpdate(progress: Int, logLine: String) {
                  val intent = Intent(ACTION_PROGRESS).apply {
                      setPackage(packageName)
                      putExtra(EXTRA_PROGRESS, progress)
                      putExtra(EXTRA_LOG, logLine)
                  }
                  sendBroadcast(intent)
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "Takeout Fixer Background Service",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(channel)
                  }
              }

              private fun buildNotification(text: String, progress: Int): Notification {
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("Takeout Fixer Studio")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.stat_sys_download)
                      .setOngoing(true)
                      .setProgress(100, progress, false)
                      .build()
              }

              private fun updateNotification(text: String, progress: Int) {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.notify(NOTIF_ID, buildNotification(text, progress))
              }

              override fun onDestroy() {
                  releaseWakeLock()
                  serviceScope.cancel()
                  super.onDestroy()
              }
          }
