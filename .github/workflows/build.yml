          package com.takeout.fixer

          import android.Manifest
          import android.animation.Animator
          import android.animation.AnimatorListenerAdapter
          import android.animation.ObjectAnimator
          import android.annotation.SuppressLint
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.DocumentsContract
          import android.provider.Settings
          import android.view.LayoutInflater
          import android.view.View
          import android.view.animation.AccelerateDecelerateInterpolator
          import android.view.animation.DecelerateInterpolator
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.app.AppCompatDelegate
          import androidx.core.content.ContextCompat
          import androidx.core.os.LocaleListCompat
          import com.google.android.material.bottomsheet.BottomSheetDialog
          import com.google.android.material.button.MaterialButton
          import com.google.android.material.dialog.MaterialAlertDialogBuilder
          import com.google.android.material.progressindicator.CircularProgressIndicator
          import com.google.android.material.progressindicator.LinearProgressIndicator

          class MainActivity : AppCompatActivity() {

              private var inputUri: Uri? = null
              private var defaultFolderUri: Uri? = null

              private lateinit var cardPermissions: View
              private lateinit var tvPermStatus: TextView
              private lateinit var btnGrantNotif: MaterialButton
              private lateinit var btnGrantBattery: MaterialButton
              private lateinit var iconStepNotif: TextView
              private lateinit var iconStepBattery: TextView

              private lateinit var btnMenu: MaterialButton
              private lateinit var btnSelectInput: MaterialButton
              private lateinit var btnStart: MaterialButton
              private lateinit var tvInputPath: TextView
              private lateinit var tvStatus: TextView
              private lateinit var tvPercent: TextView
              private lateinit var tvLog: TextView
              private lateinit var tvCustomFolderStatus: TextView
              private lateinit var progressBar: LinearProgressIndicator
              private lateinit var indicatorPulse: CircularProgressIndicator
              private lateinit var scrollLog: ScrollView

              private lateinit var prefs: SharedPreferences
              private var isCardDismissed = false

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          FixerService.ACTION_PROGRESS -> {
                              val pct = intent.getIntExtra(FixerService.EXTRA_PROGRESS, 0)
                              val status = intent.getStringExtra(FixerService.EXTRA_STATUS) ?: ""

                              val anim = ObjectAnimator.ofInt(progressBar, "progress", progressBar.progress, pct)
                              anim.duration = 400
                              anim.interpolator = DecelerateInterpolator()
                              anim.start()

                              tvPercent.text = "$pct%"
                              tvStatus.text = status
                              indicatorPulse.visibility = if (pct in 1..99) View.VISIBLE else View.INVISIBLE
                          }
                          FixerService.ACTION_LOG -> {
                              val msg = intent.getStringExtra(FixerService.EXTRA_MESSAGE) ?: ""
                              tvLog.append("$msg\n")
                              scrollLog.post { scrollLog.fullScroll(ScrollView.FOCUS_DOWN) }
                          }
                          FixerService.ACTION_COMPLETED -> {
                              val stats = intent.getStringExtra(FixerService.EXTRA_STATS) ?: "Elaborazione completata!"
                              btnSelectInput.isEnabled = true
                              btnStart.isEnabled = true
                              indicatorPulse.visibility = View.INVISIBLE
                              progressBar.progress = 100
                              tvPercent.text = "100%"
                              tvStatus.text = "Completato con successo!"
                              tvLog.append("OPERAZIONE CONCLUSA CON SUCCESSO.\n")

                              MaterialAlertDialogBuilder(this@MainActivity)
                                  .setTitle("Riepilogo Elaborazione")
                                  .setMessage(stats)
                                  .setIcon(R.drawable.ic_check_circle)
                                  .setPositiveButton("Chiudi", null)
                                  .show()
                          }
                          FixerService.ACTION_ERROR -> {
                              val error = intent.getStringExtra(FixerService.EXTRA_MESSAGE) ?: "Errore imprevisto"
                              btnSelectInput.isEnabled = true
                              btnStart.isEnabled = true
                              indicatorPulse.visibility = View.INVISIBLE
                              tvStatus.text = "Errore: $error"
                              tvLog.append("ERRORE: $error\n")
                          }
                      }
                  }
              }

              private val notifPermissionLauncher = registerForActivityResult(ActivityResultContracts.RequestPermission()) { isGranted ->
                  checkPermissionsState()
                  if (isGranted) {
                      tvLog.append("Permesso notifiche accordato.\n")
                  } else {
                      tvLog.append("Notifiche non autorizzate: la barra in tendina non sara visibile.\n")
                  }
              }

              private val pickInputLauncher = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) {
                      contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      inputUri = uri
                      tvInputPath.text = "File selezionato: ${uri.lastPathSegment ?: uri.toString()}"
                      btnStart.isEnabled = true
                      tvLog.append("Archivio pronto per l elaborazione.\n")
                  }
              }

              private val selectFolderLauncher = registerForActivityResult(ActivityResultContracts.OpenDocumentTree()) { uri ->
                  if (uri != null) {
                      contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_WRITE_URI_PERMISSION or Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      defaultFolderUri = uri
                      prefs.edit().putString("default_folder_uri", uri.toString()).apply()
                      tvCustomFolderStatus.text = "Cartella: ${uri.lastPathSegment ?: uri.toString()}"
                      tvLog.append("Cartella predefinita impostata.\n")
                  }
              }

              private val createOutputLauncher = registerForActivityResult(ActivityResultContracts.CreateDocument("application/zip")) { outUri ->
                  val inUri = inputUri
                  if (inUri != null && outUri != null) {
                      startFixingProcess(inUri, outUri)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  prefs = getSharedPreferences("takeout_fixer_prefs", Context.MODE_PRIVATE)
                  val savedTheme = prefs.getInt("app_theme", AppCompatDelegate.MODE_NIGHT_FOLLOW_SYSTEM)
                  AppCompatDelegate.setDefaultNightMode(savedTheme)

                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  initViews()
                  setupListeners()
                  loadSavedFolder()
              }

              private fun initViews() {
                  cardPermissions = findViewById(R.id.cardPermissions)
                  tvPermStatus = findViewById(R.id.tvPermStatus)
                  btnGrantNotif = findViewById(R.id.btnGrantNotif)
                  btnGrantBattery = findViewById(R.id.btnGrantBattery)
                  iconStepNotif = findViewById(R.id.iconStepNotif)
                  iconStepBattery = findViewById(R.id.iconStepBattery)

                  btnMenu = findViewById(R.id.btnMenu)
                  btnSelectInput = findViewById(R.id.btnSelectInput)
                  btnStart = findViewById(R.id.btnStart)
                  tvInputPath = findViewById(R.id.tvInputPath)
                  tvStatus = findViewById(R.id.tvStatus)
                  tvPercent = findViewById(R.id.tvPercent)
                  tvLog = findViewById(R.id.tvLog)
                  tvCustomFolderStatus = findViewById(R.id.tvCustomFolderStatus)
                  progressBar = findViewById(R.id.progressBar)
                  indicatorPulse = findViewById(R.id.indicatorPulse)
                  scrollLog = findViewById(R.id.scrollLog)
              }

              private fun loadSavedFolder() {
                  val folderStr = prefs.getString("default_folder_uri", null)
                  if (folderStr != null) {
                      defaultFolderUri = Uri.parse(folderStr)
                      tvCustomFolderStatus.text = "Cartella: ${defaultFolderUri?.lastPathSegment}"
                  }
              }

              @SuppressLint("BatteryLife")
              private fun setupListeners() {
                  btnMenu.setOnClickListener {
                      showLiquidGlassBottomSheet()
                  }

                  btnGrantNotif.setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          notifPermissionLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)
                      }
                  }

                  btnGrantBattery.setOnClickListener {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          try {
                              val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                                  data = Uri.parse("package:$packageName")
                              }
                              startActivity(intent)
                          } catch (e: Exception) {
                              val intent = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                                  data = Uri.parse("package:$packageName")
                              }
                              startActivity(intent)
                          }
                      }
                  }

                  btnSelectInput.setOnClickListener {
                      pickInputLauncher.launch(arrayOf("application/zip", "application/x-zip-compressed", "*/*"))
                  }

                  btnStart.setOnClickListener {
                      val targetDir = defaultFolderUri
                      if (targetDir != null) {
                          try {
                              val targetFileUri = DocumentsContract.createDocument(
                                  contentResolver,
                                  targetDir,
                                  "application/zip",
                                  "Takeout_Ordinato_FIXED.zip"
                              )
                              val inUri = inputUri
                              if (targetFileUri != null && inUri != null) {
                                  startFixingProcess(inUri, targetFileUri)
                                  return@setOnClickListener
                              }
                          } catch (e: Exception) {
                              tvLog.append("Salvataggio automatico fallito: ${e.message}\n")
                          }
                      }
                      createOutputLauncher.launch("Takeout_Ordinato_FIXED.zip")
                  }
              }

              private fun startFixingProcess(inUri: Uri, outUri: Uri) {
                  contentResolver.takePersistableUriPermission(outUri, Intent.FLAG_GRANT_WRITE_URI_PERMISSION or Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  btnSelectInput.isEnabled = false
                  btnStart.isEnabled = false
                  indicatorPulse.visibility = View.VISIBLE
                  tvLog.append("Avvio motore Takeout Fixer...\n")

                  val serviceIntent = Intent(this, FixerService::class.java).apply {
                      action = FixerService.ACTION_START
                      putExtra(FixerService.EXTRA_INPUT_URI, inUri)
                      putExtra(FixerService.EXTRA_OUTPUT_URI, outUri)
                  }
                  ContextCompat.startForegroundService(this, serviceIntent)
              }

              private fun showLiquidGlassBottomSheet() {
                  val dialog = BottomSheetDialog(this, R.style.GlassBottomSheetDialog)
                  val view = LayoutInflater.from(this).inflate(R.layout.layout_glass_sheet, null)

                  val optFolder = view.findViewById<View>(R.id.sheetOptFolder)
                  val optTheme = view.findViewById<View>(R.id.sheetOptTheme)
                  val optLang = view.findViewById<View>(R.id.sheetOptLanguage)
                  val optCreator = view.findViewById<View>(R.id.sheetOptCreator)
                  val btnClose = view.findViewById<View>(R.id.btnSheetClose)

                  optFolder.setOnClickListener {
                      dialog.dismiss()
                      selectFolderLauncher.launch(null)
                  }

                  optTheme.setOnClickListener {
                      dialog.dismiss()
                      showThemeDialog()
                  }

                  optLang.setOnClickListener {
                      dialog.dismiss()
                      showLanguageDialog()
                  }

                  optCreator.setOnClickListener {
                      dialog.dismiss()
                      showCreatorDialog()
                  }

                  btnClose.setOnClickListener {
                      dialog.dismiss()
                  }

                  dialog.setContentView(view)
                  dialog.show()
              }

              private fun showThemeDialog() {
                  val options = arrayOf(
                      getString(R.string.theme_system),
                      getString(R.string.theme_light),
                      getString(R.string.theme_dark)
                  )
                  val currentTheme = prefs.getInt("app_theme", AppCompatDelegate.MODE_NIGHT_FOLLOW_SYSTEM)
                  val selectedIdx = when (currentTheme) {
                      AppCompatDelegate.MODE_NIGHT_NO -> 1
                      AppCompatDelegate.MODE_NIGHT_YES -> 2
                      else -> 0
                  }

                  MaterialAlertDialogBuilder(this)
                      .setTitle(R.string.change_theme)
                      .setSingleChoiceItems(options, selectedIdx) { d, which ->
                          val newTheme = when (which) {
                              1 -> AppCompatDelegate.MODE_NIGHT_NO
                              2 -> AppCompatDelegate.MODE_NIGHT_YES
                              else -> AppCompatDelegate.MODE_NIGHT_FOLLOW_SYSTEM
                          }
                          prefs.edit().putInt("app_theme", newTheme).apply()
                          AppCompatDelegate.setDefaultNightMode(newTheme)
                          d.dismiss()
                      }
                      .setNegativeButton(R.string.close, null)
                      .show()
              }

              private fun showLanguageDialog() {
                  val languages = arrayOf("Italiano", "English")
                  MaterialAlertDialogBuilder(this)
                      .setTitle(R.string.change_language)
                      .setItems(languages) { _, which ->
                          val localeCode = if (which == 0) "it" else "en"
                          AppCompatDelegate.setApplicationLocales(LocaleListCompat.forLanguageTags(localeCode))
                          recreate()
                      }
                      .setNegativeButton(R.string.close, null)
                      .show()
              }

              private fun showCreatorDialog() {
                  MaterialAlertDialogBuilder(this)
                      .setTitle(R.string.about_creator)
                      .setMessage("Questa bellissima app e stata creata con passione da Imran Dzaferi per organizzare automaticamente ogni foto e video di Google Takeout!")
                      .setIcon(R.drawable.ic_check_circle)
                      .setPositiveButton("Grande Imran!", null)
                      .show()
              }

              private fun checkPermissionsState() {
                  var notifOk = true
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      notifOk = ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED
                  }

                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  val batteryOk = pm.isIgnoringBatteryOptimizations(packageName)

                  if (notifOk) {
                      btnGrantNotif.isEnabled = false
                      btnGrantNotif.text = getString(R.string.btn_active)
                      iconStepNotif.text = "OK"
                      iconStepNotif.setTextColor(getColor(R.color.accent_green))
                  } else {
                      btnGrantNotif.isEnabled = true
                      btnGrantNotif.text = getString(R.string.btn_activate)
                      iconStepNotif.text = "1"
                      iconStepNotif.setTextColor(getColor(R.color.glass_primary))
                  }

                  if (batteryOk) {
                      btnGrantBattery.isEnabled = false
                      btnGrantBattery.text = getString(R.string.btn_set_done)
                      iconStepBattery.text = "OK"
                      iconStepBattery.setTextColor(getColor(R.color.accent_green))
                  } else {
                      btnGrantBattery.isEnabled = true
                      btnGrantBattery.text = getString(R.string.btn_set)
                      iconStepBattery.text = "2"
                      iconStepBattery.setTextColor(getColor(R.color.glass_primary))
                  }

                  if (notifOk && batteryOk) {
                      tvPermStatus.text = getString(R.string.perm_status_complete)
                      tvPermStatus.setTextColor(getColor(R.color.accent_green))

                      if (!isCardDismissed && cardPermissions.visibility == View.VISIBLE) {
                          isCardDismissed = true
                          cardPermissions.postDelayed({
                              cardPermissions.animate()
                                  .alpha(0f)
                                  .translationY(-40f)
                                  .scaleX(0.95f)
                                  .scaleY(0.95f)
                                  .setDuration(450)
                                  .setInterpolator(AccelerateDecelerateInterpolator())
                                  .setListener(object : AnimatorListenerAdapter() {
                                      override fun onAnimationEnd(animation: Animator) {
                                          cardPermissions.visibility = View.GONE
                                      }
                                  })
                          }, 600)
                      }
                  } else {
                      tvPermStatus.text = getString(R.string.perm_status_incomplete)
                      tvPermStatus.setTextColor(getColor(R.color.accent_amber))
                      cardPermissions.visibility = View.VISIBLE
                      cardPermissions.alpha = 1f
                      cardPermissions.scaleX = 1f
                      cardPermissions.scaleY = 1f
                      cardPermissions.translationY = 0f
                      isCardDismissed = false
                  }
              }

              override fun onResume() {
                  super.onResume()
                  checkPermissionsState()
              }

              override fun onStart() {
                  super.onStart()
                  val filter = IntentFilter().apply {
                      addAction(FixerService.ACTION_PROGRESS)
                      addAction(FixerService.ACTION_LOG)
                      addAction(FixerService.ACTION_COMPLETED)
                      addAction(FixerService.ACTION_ERROR)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(receiver, filter)
                  }
              }

              override fun onStop() {
                  super.onStop()
                  unregisterReceiver(receiver)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/takeout/fixer/FixerService.kt
          package com.takeout.fixer

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat
          import androidx.exifinterface.media.ExifInterface
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.io.*
          import java.text.SimpleDateFormat
          import java.util.*
          import java.util.zip.ZipEntry
          import java.util.zip.ZipInputStream
          import java.util.zip.ZipOutputStream
          import kotlin.math.abs

          class FixerService : Service() {

              private val serviceJob = Job()
              private val serviceScope = CoroutineScope(Dispatchers.IO + serviceJob)
              private var wakeLock: PowerManager.WakeLock? = null

              companion object {
                  const val CHANNEL_ID = "takeout_fixer_fg_channel"
                  const val NOTIF_ID = 2001

                  const val ACTION_START = "ACTION_START"
                  const val ACTION_PROGRESS = "com.takeout.fixer.ACTION_PROGRESS"
                  const val ACTION_COMPLETED = "com.takeout.fixer.ACTION_COMPLETED"
                  const val ACTION_ERROR = "com.takeout.fixer.ACTION_ERROR"
                  const val ACTION_LOG = "com.takeout.fixer.ACTION_LOG"

                  const val EXTRA_INPUT_URI = "EXTRA_INPUT_URI"
                  const val EXTRA_OUTPUT_URI = "EXTRA_OUTPUT_URI"
                  const val EXTRA_PROGRESS = "EXTRA_PROGRESS"
                  const val EXTRA_STATUS = "EXTRA_STATUS"
                  const val EXTRA_MESSAGE = "EXTRA_MESSAGE"
                  const val EXTRA_STATS = "EXTRA_STATS"
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  val powerManager = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = powerManager.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "TakeoutFixer::ProcessingWakeLock")
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_START) {
                      val inUri = intent.getParcelableExtra<Uri>(EXTRA_INPUT_URI)
                      val outUri = intent.getParcelableExtra<Uri>(EXTRA_OUTPUT_URI)
                      if (inUri != null && outUri != null) {
                          startForeground(NOTIF_ID, buildForegroundNotification(0, "Inizializzazione Takeout Fixer v8..."))
                          wakeLock?.acquire(240 * 60 * 1000L)
                          serviceScope.launch {
                              processZip(inUri, outUri)
                          }
                      } else {
                          stopSelf()
                      }
                  }
                  return START_NOT_STICKY
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "Elaborazione Takeout (Background)",
                          NotificationManager.IMPORTANCE_LOW
                      ).apply {
                          description = "Mantiene l app attiva in background durante l elaborazione"
                      }
                      val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      manager.createNotificationChannel(channel)
                  }
              }

              private fun buildForegroundNotification(progress: Int, status: String): Notification {
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.stat_sys_download)
                      .setContentTitle("Takeout Fixer in esecuzione")
                      .setContentText(status)
                      .setProgress(100, progress, false)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .build()
              }

              private fun notifyProgress(pct: Int, status: String) {
                  val notifManager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  notifManager.notify(NOTIF_ID, buildForegroundNotification(pct, status))

                  val intent = Intent(ACTION_PROGRESS).apply {
                      putExtra(EXTRA_PROGRESS, pct)
                      putExtra(EXTRA_STATUS, status)
                      setPackage(packageName)
                  }
                  sendBroadcast(intent)
              }

              private fun sendLog(msg: String) {
                  val intent = Intent(ACTION_LOG).apply {
                      putExtra(EXTRA_MESSAGE, msg)
                      setPackage(packageName)
                  }
                  sendBroadcast(intent)
              }

              private fun sendDoneNotification(title: String, message: String) {
                  val notifManager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val notif = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.stat_sys_download_done)
                      .setContentTitle(title)
                      .setContentText(message)
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setAutoCancel(true)
                      .build()
                  notifManager.notify(2002, notif)
              }

              private fun findJsonForMedia(mediaFile: File): File? {
                  val parent = mediaFile.parentFile ?: return null
                  val name = mediaFile.name
                  val stem = mediaFile.nameWithoutExtension
                  val ext = mediaFile.extension

                  val children = parent.listFiles() ?: return null
                  for (f in children) {
                      if (f.name.startsWith("$name.") && f.name.endsWith(".json")) return f
                  }
                  val direct = File(parent, "$stem.json")
                  if (direct.exists()) return direct

                  if (stem.contains("(") && stem.endsWith(")")) {
                      val idx = stem.lastIndexOf("(")
                      val base = stem.substring(0, idx)
                      val num = stem.substring(idx)
                      val swapped = File(parent, "$base.$ext$num.json")
                      if (swapped.exists()) return swapped
                  }
                  return null
              }

              private fun convertToRationalLatLon(deg: Double): String {
                  val d = abs(deg)
                  val degrees = d.toInt()
                  val minutesFloat = (d - degrees) * 60
                  val minutes = minutesFloat.toInt()
                  val seconds = ((minutesFloat - minutes) * 60 * 10000).toInt()
                  return "$degrees/1,$minutes/1,$seconds/10000"
              }

              private suspend fun processZip(inUri: Uri, outUri: Uri) {
                  val workDir = File(cacheDir, "takeout_work_${System.currentTimeMillis()}")
                  workDir.mkdirs()

                  val yearStats = mutableMapOf<String, Int>()
                  var gpsCount = 0

                  try {
                      notifyProgress(5, "1/3 Decompressione archivio Takeout...")
                      sendLog("Decompressione in streaming su memoria interna...")

                      contentResolver.openInputStream(inUri)?.use { rawIn ->
                          ZipInputStream(BufferedInputStream(rawIn)).use { zis ->
                              var entry: ZipEntry? = zis.nextEntry
                              val buffer = ByteArray(65536)
                              while (entry != null) {
                                  if (!entry.isDirectory) {
                                      val outFile = File(workDir, entry.name)
                                      outFile.parentFile?.mkdirs()
                                      FileOutputStream(outFile).use { fos ->
                                          var len: Int
                                          while (zis.read(buffer).also { len = it } > 0) {
                                              fos.write(buffer, 0, len)
                                          }
                                      }
                                  }
                                  zis.closeEntry()
                                  entry = zis.nextEntry
                              }
                          }
                      }

                      notifyProgress(35, "2/3 Applicazione metadati e cartelle Anno Mese...")
                      val allFiles = workDir.walkTopDown().filter { it.isFile && !it.name.endsWith(".json", true) }.toList()
                      val total = allFiles.size
                      var merged = 0

                      val exifDateFormat = SimpleDateFormat("yyyy:MM:dd HH:mm:ss", Locale.US).apply {
                          timeZone = TimeZone.getDefault()
                      }
                      val folderDateFormat = SimpleDateFormat("yyyy/MM - MMMM", Locale.ITALIAN).apply {
                          timeZone = TimeZone.getDefault()
                      }
                      val yearFormat = SimpleDateFormat("yyyy", Locale.US).apply {
                          timeZone = TimeZone.getDefault()
                      }

                      val targetPathMap = mutableMapOf<File, String>()

                      for ((index, mediaFile) in allFiles.withIndex()) {
                          val jsonFile = findJsonForMedia(mediaFile)
                          var takenTime = mediaFile.lastModified()

                          if (jsonFile != null && jsonFile.exists()) {
                              try {
                                  val jsonObj = JSONObject(jsonFile.readText())
                                  val ts = jsonObj.optJSONObject("photoTakenTime")?.optString("timestamp", "0")?.toLongOrNull() ?: 0L
                                  val geo = jsonObj.optJSONObject("geoData")
                                  val lat = geo?.optDouble("latitude", 0.0) ?: 0.0
                                  val lon = geo?.optDouble("longitude", 0.0) ?: 0.0
                                  val desc = jsonObj.optString("description", "")

                                  if (ts > 0) takenTime = ts * 1000

                                  val ext = mediaFile.extension.lowercase()
                                  if (ext == "jpg" || ext == "jpeg" || ext == "webp") {
                                      val exif = ExifInterface(mediaFile)
                                      if (ts > 0) {
                                          val dateStr = exifDateFormat.format(Date(takenTime))
                                          exif.setAttribute(ExifInterface.TAG_DATETIME, dateStr)
                                          exif.setAttribute(ExifInterface.TAG_DATETIME_ORIGINAL, dateStr)
                                          exif.setAttribute(ExifInterface.TAG_DATETIME_DIGITIZED, dateStr)
                                      }
                                      if (lat != 0.0 || lon != 0.0) {
                                          exif.setAttribute(ExifInterface.TAG_GPS_LATITUDE, convertToRationalLatLon(lat))
                                          exif.setAttribute(ExifInterface.TAG_GPS_LATITUDE_REF, if (lat >= 0) "N" else "S")
                                          exif.setAttribute(ExifInterface.TAG_GPS_LONGITUDE, convertToRationalLatLon(lon))
                                          exif.setAttribute(ExifInterface.TAG_GPS_LONGITUDE_REF, if (lon >= 0) "E" else "W")
                                          gpsCount++
                                      }
                                      if (desc.isNotEmpty()) {
                                          exif.setAttribute(ExifInterface.TAG_IMAGE_DESCRIPTION, desc)
                                      }
                                      exif.saveAttributes()
                                  }

                                  if (ts > 0) mediaFile.setLastModified(takenTime)
                                  merged++
                              } catch (e: Exception) {
                                  sendLog("JSON ignorato per ${mediaFile.name}: ${e.message}")
                              }
                          }

                          val dateObj = Date(takenTime)
                          val folderName = folderDateFormat.format(dateObj)
                          val yearStr = yearFormat.format(dateObj)
                          yearStats[yearStr] = (yearStats[yearStr] ?: 0) + 1

                          targetPathMap[mediaFile] = "$folderName/${mediaFile.name}"

                          if (index % 25 == 0 || index == total - 1) {
                              val pct = 35 + ((index + 1) * 35 / total.coerceAtLeast(1))
                              notifyProgress(pct, "2/3 Metadati e cartelle: ${index + 1}/$total")
                          }
                      }

                      notifyProgress(70, "3/3 Compressione ZIP finale...")
                      sendLog("Compressione e ottimizzazione finale...")

                      contentResolver.openOutputStream(outUri)?.use { rawOut ->
                          ZipOutputStream(BufferedOutputStream(rawOut)).use { zos ->
                              val buffer = ByteArray(65536)
                              for ((index, mediaFile) in allFiles.withIndex()) {
                                  val relPath = targetPathMap[mediaFile] ?: mediaFile.name
                                  val zipEntry = ZipEntry(relPath).apply {
                                      time = mediaFile.lastModified()
                                  }
                                  zos.putNextEntry(zipEntry)
                                  FileInputStream(mediaFile).use { fis ->
                                      var len: Int
                                      while (fis.read(buffer).also { len = it } > 0) {
                                          zos.write(buffer, 0, len)
                                      }
                                  }
                                  zos.closeEntry()

                                  if (index % 25 == 0 || index == total - 1) {
                                      val pct = 70 + ((index + 1) * 30 / total.coerceAtLeast(1))
                                      notifyProgress(pct, "3/3 Compressione ZIP: ${index + 1}/$total")
                                  }
                              }
                          }
                      }

                      notifyProgress(100, "Elaborazione completata!")
                      sendDoneNotification("Takeout Fixer", "Completato: $merged file uniti e organizzati!")

                      val statsBuilder = StringBuilder()
                      statsBuilder.append("Totale file multimediali: $total\n")
                      statsBuilder.append("Metadati JSON abbinati: $merged\n")
                      statsBuilder.append("Foto con coordinate GPS: $gpsCount\n\n")
                      statsBuilder.append("Ripartizione per Anno:\n")
                      yearStats.toSortedMap(compareByDescending { it }).forEach { (anno, count) ->
                          statsBuilder.append("• $anno: $count file\n")
                      }

                      val compIntent = Intent(ACTION_COMPLETED).apply {
                          putExtra(EXTRA_STATS, statsBuilder.toString())
                          setPackage(packageName)
                      }
                      sendBroadcast(compIntent)

                  } catch (e: Exception) {
                      notifyProgress(0, "Errore durante l elaborazione")
                      sendLog("ERRORE: ${e.message}")
                      sendDoneNotification("Takeout Fixer", "Errore: ${e.message}")

                      val errIntent = Intent(ACTION_ERROR).apply {
                          putExtra(EXTRA_MESSAGE, e.message ?: "Errore sconosciuto")
                          setPackage(packageName)
                      }
                      sendBroadcast(errIntent)
                  } finally {
                      workDir.deleteRecursively()
                      if (wakeLock?.isHeld == true) wakeLock?.release()
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  serviceJob.cancel()
                  if (wakeLock?.isHeld == true) wakeLock?.release()
              }
          }
          EOF

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Compila APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Carica APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: TakeoutFixer-APK-v8
          path: app/build/outputs/apk/debug/app-debug.apk
